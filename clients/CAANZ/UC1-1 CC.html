                            if (videoWrapper) {
                                const videoContainer = videoWrapper.querySelector(
                                    "div.rich-text.container.mx-auto");
                                if (videoContainer) videoWrapper.parentNode.insertBefore(
                                    videoContainer, videoWrapper);
                                videoWrapper.remove()
                            }
                            const headingWrapper = document.querySelector(
                            ".at-richtext-header");
                            if (headingWrapper) {
                                const movedRichText = headingWrapper.querySelector(
                                    "div.rich-text.container.mx-auto");
                                if (movedRichText) headingWrapper.parentNode.insertBefore(
                                    movedRichText, headingWrapper);
                                headingWrapper.remove()
                            }
                            const slider = $(".at-caanz-all-slick-2");
                            if (slider.length && slider.hasClass("slick-initialized")) slider
                                .slick("unslick");
                            ["#at-sustainability-video-wrapper", "#action_insert_1787548658480",
                                ".sustainability-banner"
                            ].forEach(selector => {
                                document.querySelectorAll(selector).forEach(element =>
                                    element.remove())
                            });
                            document.querySelectorAll("#action_insert_1787545534995").forEach(
                                element => {
                                    element.querySelectorAll(".at-richtext-header").forEach(
                                        header => header.remove())
                                });
                            document.querySelectorAll("[data-at-caanz-hidden]").forEach(
                                element => {
                                    element.style.display = "";
                                    element.removeAttribute("data-at-caanz-hidden")
                                })
                        })
                    }
                }
                loadPackages().then(runYourCode).catch(error => {
                    console.error("An error occurred while loading packages:", error)
                });
            })();
        },
    });
</script>
