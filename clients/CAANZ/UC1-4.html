<style>
  *,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --ca-tint: #e7ebf8;
    --bg-tint2: #dce4ff;
    --ca-grey: #fbfbfb;
    --ca-azure: #0934bb;
    --ca-blue: #00b2e2;
    --ca-indigo: #261a42;
    --ca-red: #ea0029;
    --at-ca-black2: #101010;
    --at-ca-red2: #e81d2d;
    --at-ca-red-focus: #f9c6ca;
    --at-indigo: #261a42;
    --at-ease: cubic-bezier(0.4, 0, 0.2, 1);
}

.at-caanz-all {
    scroll-behavior: smooth;
    line-height: 1.5;
}

.at-caanz-all-adjust-y {
    padding-top: 32px;
    padding-bottom: 32px;
}

.at-caanz-all-adjust-y--2 {
    padding-top: 24px;
    padding-bottom: 24px;
}

.at-caanz-all ul,
ol {
    list-style: none;
}

.at-caanz-all img {
    max-width: 100%;
    height: auto;
    display: block;
}

.at-caanz-all input,
select,
textarea {
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
}

.at-caanz-hta-section {
    display: none;
}

.at-caanz-hta-section.active {
    display: block;
    animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

.at-wrap-tile-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
}

.at-wrap-tile {
    border-radius: 6px;
    box-shadow: rgba(0, 0, 0, 0.15) 0px 6px 12px 0px;
}

.at-wrap-tile--top {
    height: 156px;
    padding: 12px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-bottom: 1px solid #cccccc;
}

.at-wrap-tile--bottom {
    padding: 16px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.at-wrap-tile-title {
    display: -webkit-box !important;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
    max-height: calc(1.4em * 2);
    word-break: break-word;
}

.at-wrap-tile-variant1 {
    padding: 40px 40px;
    height: 328px;
    border-radius: 4px;
}

.at-wrap-tile-special {
    height: 100%;
    min-height: 200px;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    border-radius: 6px;
}

.at-wrap-tile-bubble {
    padding-left: 10px;
    padding-right: 10px;
    font-size: 12px;
    border-radius: 20px;
}

.at-wrap-tile-link {
    cursor: pointer;
    text-align: center;
    padding-top: 8px;
    padding-bottom: 8px;
    border-bottom-left-radius: 6px;
    border-bottom-right-radius: 6px;
}

@media (min-width: 768px) {
    .at-wrap-tile-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (min-width: 1024px) {
    .at-wrap-tile-container {
        grid-template-columns: repeat(3, 1fr);
    }
}

.at-cpddcoe-carousel--1 h3 {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
    max-height: calc(1.4em * 2);
    word-break: break-word;
}

.at-cpddcoe-carousel--1 p {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
    max-height: calc(1.5em * 2);
    word-break: break-word;
}

.at-cpddcoe-carousel--1-tiles p {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
}

.at-cpddcoe-carousel--1-tiles p:hover {
    -webkit-line-clamp: unset;
    max-height: none;
}
