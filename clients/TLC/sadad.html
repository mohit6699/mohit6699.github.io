function waitForJurisdiction(callback, maxAttempts = 10, interval = 500) {
  let attempts = 0;
 
  const checkValue = () => {
    const jurisdiction = _satellite.getVar("Jurisdiction")?.toUpperCase();
 
    if (jurisdiction) {
      callback(jurisdiction);
    } else if (attempts < maxAttempts) {
      attempts++;
      setTimeout(checkValue, interval);
    } else {
      console.warn("Jurisdiction value not available within timeout.");
    }
  };
 
  checkValue();
}
 
// Wait for jurisdiction value and then fire event
waitForJurisdiction((jurisdiction) => {
  alloy("sendEvent", {
    xdm: {
      identityMap: {
        JURISDICTION: [
          {
            id: jurisdiction,
            authenticatedState: "loggedOut",
            primary: false
          }
        ]
      }
    }
  });
});
