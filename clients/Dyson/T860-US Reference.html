<script>

        const PRODUCT_API_BASE = "https://api.dyson.co.uk/apiman-gateway/dyson/product/1.0";
        const DEFAULT_COUNTRY = "us";

        const DEFAULT_COMPARISON_IMAGE_URL =
            "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/comparison2026icons/Comparison_Default_Image.jpg";
        const TICK_ICON_URL =
            "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/comparison2026icons/tick-icon.png";

        const US_CORDLESS_DATA = window.DYSON_US_CORDLESS_DATA || {};

        const uniqueRanges = Array.from(
            new Set(
                Object.values(US_CORDLESS_DATA)
                .map(item => item && item.Range)
                .filter(Boolean)
            )
        ).sort();

        const dysonModelGroups = [{
            label: "Cordless vacuums",
            models: uniqueRanges.map(range => ({
                id: range,
                label: range
            }))
        }];

        function getVariantsForModel(modelId) {
            if (!modelId) return [];
            const variants = [];
            Object.keys(US_CORDLESS_DATA).forEach(name => {
                const row = US_CORDLESS_DATA[name];
                if (!row || row.Range !== modelId || !row.SKU) return;
                variants.push({
                    id: row.SKU,
                    label: name,
                    sku: row.SKU,
                    url: row.URL || null
                });
            });
            return variants;
        }

        function getCordlessDataBySku(sku) {
            if (!sku) return null;
            const entries = Object.entries(US_CORDLESS_DATA);
            for (let i = 0; i < entries.length; i++) {
                const name = entries[i][0];
                const row = entries[i][1];
                if (row && row.SKU === sku) return {
                    name,
                    data: row
                };
            }
            return null;
        }

        function extractBoxItemsFromApi(apiData) {
            const items = [];
            if (!apiData || !Array.isArray(apiData.productReferences)) return items;
            apiData.productReferences.forEach(ref => {
                if (!ref || ref.referenceType !== "CONSISTS_OF" || !ref.target) return;
                const target = ref.target;
                const name = typeof target.webName === "string" ? target.webName : "";
                const img = typeof target.lifestyleImageUrl === "string" ? target.lifestyleImageUrl : "";
                if (name || img) items.push({
                    name,
                    imageUrl: img
                });
            });
            return items;
        }

        function updateBoxForSlot(slot, apiData) {
            if (!selectedVariants[slot] || !apiData) slotBoxItems[slot] = null;
            else slotBoxItems[slot] = extractBoxItemsFromApi(apiData);
            renderBoxAccordion();
        }

        function renderBoxAccordion() {
            if (!boxAccordionRoot || !boxRowsEl || !boxAccHeader || !boxAccBody) return;

            let anyVariantSelected = false;
            for (let slot = 1; slot <= MAX_SLOTS; slot++) {
                if (selectedVariants[slot]) {
                    anyVariantSelected = true;
                    break;
                }
            }

            if (!anyVariantSelected) {
                boxRowsEl.innerHTML = "";
                boxAccordionRoot.style.display = "none";
                boxAccBody.style.display = "none";
                boxAccHeader.classList.add("collapsed");
                updateHighlightDifferences();
                return;
            }

            const nameMap = new Map();
            for (let slot = 1; slot <= MAX_SLOTS; slot++) {
                const items = slotBoxItems[slot];
                if (!Array.isArray(items)) continue;
                items.forEach(item => {
                    const key = item && item.name ? String(item.name).trim() : "";
                    if (!key) return;
                    if (!nameMap.has(key)) nameMap.set(key, {});
                    const perSlot = nameMap.get(key);
                    perSlot[slot] = item;
                });
            }

            if (nameMap.size === 0) {
                boxRowsEl.innerHTML = "";
                boxAccordionRoot.style.display = "none";
                boxAccBody.style.display = "none";
                boxAccHeader.classList.add("collapsed");
                updateHighlightDifferences();
                return;
            }

            boxAccordionRoot.style.display = "block";
            boxRowsEl.innerHTML = "";

            const toolNames = Array.from(nameMap.keys());
            toolNames.forEach(toolName => {
                const perSlot = nameMap.get(toolName);
                const rowDiv = document.createElement("div");
                rowDiv.className = "dyson-box-row";

                for (let slot = 1; slot <= MAX_SLOTS; slot++) {
                    const cellDiv = document.createElement("div");
                    cellDiv.className = "dyson-box-cell";
                    cellDiv.setAttribute("data-slot", String(slot));

                    const item = perSlot[slot];
                    if (item && (item.name || item.imageUrl)) {
                        if (item.imageUrl) {
                            const imgWrap = document.createElement("div");
                            imgWrap.className = "dyson-box-item-img";
                            const img = document.createElement("img");
                            img.src = item.imageUrl;
                            img.alt = item.name || "";
                            imgWrap.appendChild(img);
                            cellDiv.appendChild(imgWrap);
                        }
                        const textDiv = document.createElement("div");
                        textDiv.className = "dyson-box-item-text";
                        textDiv.textContent = item.name || "";
                        cellDiv.appendChild(textDiv);
                    } else {
                        const missing = document.createElement("div");
                        missing.className = "dyson-box-missing";
                        missing.textContent = "–";
                        cellDiv.appendChild(missing);
                    }

                    rowDiv.appendChild(cellDiv);
                }

                boxRowsEl.appendChild(rowDiv);
            });

            boxAccBody.style.display = boxAccHeader.classList.contains("collapsed") ? "none" : "block";
            updateHighlightDifferences();
        }

        function getCookieVal(cname) {
            var cookie = (document.cookie || "").split(";");
            for (var i = cookie.length - 1; i >= 0; i--) {
                if (cookie[i].trim().indexOf(cname + "=") > -1) {
                    return decodeURIComponent(cookie[i].trim().replace(cname + "=", ""));
                }
            }
            return null;
        }

        function checkLoggedIn() {
            try {
                if (!window.dataLayer || !dataLayer.customer) return false;
                return dataLayer.customer.credentialID && dataLayer.customer.credentialID !== "anonymous";
            } catch (e) {
                return false;
            }
        }

        function getCartGuid() {
            var raw = getCookieVal("cartguid");
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (e) {
                return raw;
            }
        }

        function compareHandleSuccessResponse(btn) {
            if (!btn) return;
            btn.textContent = addingCartText;
            setTimeout(function() {
                btn.textContent = "";
            }, 300);
            setTimeout(function() {
                btn.parentElement && btn.parentElement.classList.add("completed");
                window.open(basketURL, "_self");
            }, 800);
        }

        function compareHandleError(btn) {
            if (!btn) return;
            btn.textContent = "Add to basket";
            btn.removeAttribute("disabled");
        }

        function compareSendAddToCartRequest(url, sku, btn) {
            var xhttp = new XMLHttpRequest();
            xhttp.withCredentials = true;

            xhttp.onreadystatechange = function() {
                if (this.readyState === 4 && this.status === 200) {
                    compareHandleSuccessResponse(btn);
                } else if (this.readyState === 4 && this.status !== 200) {
                    compareHandleError(btn);
                }
            };

            xhttp.open("POST", url, true);
            xhttp.setRequestHeader("Accept", "application/json");
            xhttp.setRequestHeader("Content-type", "application/json");
            xhttp.setRequestHeader("x-csrf-token", getCookieVal("CSRF_TOKEN") || "");

            var productPayload = JSON.stringify({
                product: {
                    code: sku
                },
                quantity: 1
            });
            xhttp.send(productPayload);
        }

        function compareAddProductToExistingCart(sku, btn) {
            var cartGUID = getCartGuid();
            if (!cartGUID) {
                compareCreateNewCartAndAddProduct(sku, btn);
                return;
            }
            var url = cartBaseUrl + "users/anonymous/carts/" + cartGUID + "/entries";

            var xhttp = new XMLHttpRequest();
            xhttp.withCredentials = true;

            xhttp.onreadystatechange = function() {
                if (this.readyState === 4 && this.status === 200) {
                    try {
                        var res = JSON.parse(this.responseText);
                        if (res && res.guid) {
                            document.cookie = "cartguid=" + encodeURIComponent(res.guid) + ";path=/";
                        }
                    } catch (e) {}
                    compareHandleSuccessResponse(btn);
                } else if (this.readyState === 4 && this.status !== 200) {
                    compareHandleError(btn);
                }
            };

            xhttp.open("POST", url, true);
            xhttp.setRequestHeader("Accept", "application/json");
            xhttp.setRequestHeader("Content-type", "application/json");
            xhttp.setRequestHeader("x-csrf-token", getCookieVal("CSRF_TOKEN") || "");

            var cartPayload = JSON.stringify({
                product: {
                    code: sku
                },
                quantity: 1
            });
            xhttp.send(cartPayload);
        }

        function compareAddToCartAuthenticated(userId, sku, btn) {
            var url = cartBaseUrl + "users/" + encodeURIComponent(userId) + "/carts/current";
            compareSendAddToCartRequest(url, sku, btn);

        function compareRedirectToBundlePage(bundleId, sku) {
            var url = bundleUrl + bundleId + "." + sku;
            window.location.href = url;

        function compareCheckProductDetails(sku, btn) {
            sku = sku.replace(/(GB|FR|IT|NL|DE|ES|CA|AT|NO|SE|DK|FI|PT|BE|IE|CH|US|JP)/g, "");
            var productDetailsUrl = productUrl + sku;

            var xhttp = new XMLHttpRequest();
            xhttp.withCredentials = true;

            xhttp.onreadystatechange = function() {
                if (this.readyState === 4 && this.status === 200) {
                    try {
                        var res = JSON.parse(this.responseText);
                        if (res && res.parentBundleConfig) {
                            compareRedirectToBundlePage(res.parentBundleConfig.id, sku);
                        } else {
                            compareProceedWithAddToCart(sku, btn);
                        }
                    } catch (e) {
                        compareHandleError(btn);
                    }
                } else if (this.readyState === 4 && this.status !== 200) {
                    compareHandleError(btn);
                }
            };

            xhttp.open("GET", productDetailsUrl, true);
            xhttp.setRequestHeader("Accept", "application/json");
            xhttp.send();
        }

        function compareProceedWithAddToCart(sku, btn) {
            var guid = getCartGuid();

            if (checkLoggedIn()) {
                try {
                    var userId = dataLayer.customer.credentialID;
                    compareAddToCartAuthenticated(userId, sku, btn);
                } catch (e) {
                    compareCreateNewCartAndAddProduct(sku, btn);
                }
            } else if (guid) {
                compareAddProductToExistingCart(sku, btn);
            } else {
                compareCreateNewCartAndAddProduct(sku, btn);
            }
        }

        function compareAddToCart(e, sku, btn) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (!sku || !btn) return;
            btn.setAttribute("disabled", "disabled");
            btn.textContent = addingCartText;
            compareCheckProductDetails(sku, btn);
        }

        /* Sticky header helpers */
        function updateStickyHeader() {
            if (!stickyHeader) return;
            const activeSlots = getActiveSlots();
            if (activeSlots.length < 2) {
                stickyHeader.style.display = "none";
                return;
            }

            for (let slot = 1; slot <= MAX_SLOTS; slot++) {
                const cell = stickyHeader.querySelector('.dyson-sticky-header-cell[data-slot="' + slot + '"]');
                if (!cell) continue;
                const titleEl = cell.querySelector('[data-role="sticky-title"]');
                const priceEl = cell.querySelector('[data-role="sticky-price"]');
                const btn = cell.querySelector('[data-role="sticky-add"]');
                const state = stickyState[slot];

                if (!state || !selectedVariants[slot]) {
                    if (titleEl) titleEl.textContent = "";
                    if (priceEl) priceEl.textContent = "";
                    if (btn) {
                        btn.style.display = "none";
                        btn.onclick = null;
                    }
                    cell.classList.add("empty");
                } else {
                    if (titleEl) titleEl.textContent = state.label || "";
                    if (priceEl) priceEl.textContent = state.priceText || "";
                    if (btn) {
                        btn.style.display = "inline-block";
                        btn.disabled = false;
                        btn.textContent = "Add to basket";
                        btn.onclick = function(e) {
                            compareAddToCart(e, state.sku, btn);
                        };
                    }
                    cell.classList.remove("empty");
                }
            }
        }

        function updateStickyVisibility() {
            if (!stickyHeader || !twoCardSection) return;
            const activeSlots = getActiveSlots();
            if (activeSlots.length < 2) {
                stickyHeader.style.display = "none";
                return;
            }
            const rect = twoCardSection.getBoundingClientRect();
            const thresholdPassed = rect.top < 0; // show once compare section scrolled past top
            stickyHeader.style.display = thresholdPassed ? "block" : "none";
        }

        window.addEventListener("scroll", updateStickyVisibility);
        window.addEventListener("resize", updateStickyVisibility);

        function updateSpecsForSlot(slot, variant) {

                slotSpecs[slot] = null;

            const info = getCordlessDataBySku(variant.sku);
            if (info && info.data) {
                const d = info.data;
                const kf = d["Key Features"] || {};
                const specs = d["Specifications"] || {};
                slotSpecs[slot] = {
                    suctionPower: kf["Suction Power (AW)"] != null ? kf["Suction Power (AW)"] + " AW" : null,
                    runTime: kf["Run Time"] != null ? kf["Run Time"] + " min" : null,
                    productWeight: kf["Product Weight"] != null ? kf["Product Weight"] + " lb" : null,
                    binVolume: kf["Bin Volume"] != null ? kf["Bin Volume"] : null,
                    chargeTime: specs["Charge Time (hrs)"] != null ? specs["Charge Time (hrs)"] + " hrs" : null,
                    height: specs["Product Height (in)"] != null ? specs["Product Height (in)"] + " in" : null,
                    length: specs["Product Length/Depth"] != null ? specs["Product Length/Depth"] + " in" : null,
                    width: specs["Product Width"] != null ? specs["Product Width"] + " in" : null,
                    motor: null,
                    filtration: specs["Filtration"] || null
                };
            } else {
                slotSpecs[slot] = null;
            }

            renderGlobalSpecs();
        }

            if (!variant || !variant.sku) {
                slotFeatures[slot] = null;

            if (info && info.data) {
                const ft = info.data["Features & Technology"] || {};
                slotFeatures[slot] = {
                    dustDetection: !!ft["Dust detection"],
                    cleaningTaskRecognition: !!ft["Cleaning task recognition"],
                    floorDetection: !!ft["Floor detection"],
                    cleanerIllumination: !!ft["Cleaner illumination"],
                    swappableBattery: !!ft["Swappable battery"],
                    lcdScreen: !!ft["LCD screen"],
                    runTimeCountdown: !!ft["Runtime countdown"],
                    appConnectivity: !!ft["App connectivity"]
                };
            } else {
                slotFeatures[slot] = null;
            }
            renderFeaturesAccordion();
        }

        function updateCardInfo(slot, variant, apiData) {
            const cardEl = cards[slot];
            if (!cardEl) return;

            const panelEl = cardEl.querySelector('[data-role="summary-panel"]');
            const imgEl = cardEl.querySelector('img[data-role="image"]');

            cardEl.removeAttribute("data-sku");

            if (!variant) {

                    imgEl.src = DEFAULT_COMPARISON_IMAGE_URL;

                    ratingTextEl.style.display = "none";
                    ratingTextEl.textContent = "–";
                }
                if (priceEl) {
                    priceEl.style.display = "none";
                    priceEl.textContent = "–";
                }
                if (buttonsWrap) buttonsWrap.style.display = "none";
                if (addBtn) {
                    addBtn.onclick = null;
                    addBtn.removeAttribute("disabled");
                    addBtn.textContent = "Add to basket";
                }
                if (learnMoreBtn) {
                    learnMoreBtn.onclick = null;
                    learnMoreBtn.style.visibility = "hidden";
                }
                slotSpecs[slot] = null;
                slotFeatures[slot] = null;
                slotBoxItems[slot] = null;
                stickyState[slot] = null;
                selectedVariants[slot] = null;
                renderGlobalSpecs();
                renderFeaturesAccordion();
                renderBestForAccordion();
                renderBoxAccordion();
                updateStickyHeader();
                updateStickyVisibility();
                return;
            }

            if (variant.sku) cardEl.setAttribute("data-sku", variant.sku);

            const fallbackPrice = variant.price || "–";
            const fallbackRatingText = "–";
            const fallbackImage = "";

            let priceFromApi = null;
            let ratingFromApi = null;
            let reviewsFromApi = null;
            let imageFromApi = null;
            let productDetailUrl = variant.url || null;

            if (apiData && typeof apiData === "object") {
                if (apiData.reducedPrice && apiData.reducedPrice.formattedValue) {
                    priceFromApi = apiData.reducedPrice.formattedValue;
                } else if (apiData.price && apiData.price.formattedValue) {
                    priceFromApi = apiData.price.formattedValue;
                }
                if (apiData.bazaarVoiceAverageRating) ratingFromApi = apiData.bazaarVoiceAverageRating;
                if (apiData.bazaarVoiceNumberOfReviews) reviewsFromApi = apiData.bazaarVoiceNumberOfReviews;
                if (apiData.heroImageUrl) imageFromApi = apiData.heroImageUrl;
                if (apiData.url) productDetailUrl = apiData.url;
            }

            const finalPrice = priceFromApi || fallbackPrice;
            const finalRatingText =
                ratingFromApi && reviewsFromApi ? String(ratingFromApi) + " (" + String(reviewsFromApi) + ")" : fallbackRatingText;
            const finalImage = imageFromApi || fallbackImage || DEFAULT_COMPARISON_IMAGE_URL;

            // Label for sticky header
            let label = variant.label || variant.sku;
            const info = getCordlessDataBySku(variant.sku);
            if (info && info.data) {
                const d = info.data;
                const range = d.Range;
                const varName = d.Variant && d.Variant !== "-" ? d.Variant : "";
                label = varName ? (range + " " + varName) : (info.name || range || variant.label || variant.sku);
            }

            // Update main card
            if (panelEl) panelEl.style.display = "block";
            if (imgEl) {
                imgEl.src = finalImage;
                imgEl.alt = label || variant.label || "";
                imgEl.style.display = "block";
            }
            if (starsRow) starsRow.style.display = "block";
            if (ratingTextEl) {
                ratingTextEl.style.display = "block";
                ratingTextEl.textContent = finalRatingText;
            }
            if (priceEl) {
                priceEl.style.display = "block";
                priceEl.textContent = finalPrice;
            }
            if (buttonsWrap) buttonsWrap.style.display = "flex";

            if (addBtn) {
                addBtn.removeAttribute("disabled");
                addBtn.textContent = "Add to basket";
                addBtn.onclick = function(e) {
                    const sku = cardEl.getAttribute("data-sku");
                    if (!sku) return;
                    compareAddToCart(e, sku, addBtn);
                };
            }

            if (learnMoreBtn) {
                if (productDetailUrl) {
                    learnMoreBtn.style.visibility = "visible";
                    learnMoreBtn.onclick = function() {
                        window.open(productDetailUrl, "_blank");
                    };
                } else {
                    learnMoreBtn.onclick = null;
                    learnMoreBtn.style.visibility = "hidden";
                }
            }

            updateSpecsForSlot(slot, variant);
            updateFeaturesForSlot(slot, variant);
            updateBoxForSlot(slot, apiData || null);
            renderBestForAccordion();
            selectedVariants[slot] = variant.sku;

            // Sticky state
            stickyState[slot] = {
                sku: variant.sku,
                label: label,
                priceText: finalPrice
            };

            updateStickyHeader();
            updateStickyVisibility();
        }

        function updateProductSummary(slot, modelId, variantId) {
            const cardEl = cards[slot];
            if (!cardEl) return;

            if (!modelId || !variantId) {
                updateCardInfo(slot, null, null);
                return;
            }

            const variants = getVariantsForModel(modelId) || [];
            const variant = variants.find(v => v.id === variantId);
            if (!variant) {
                updateCardInfo(slot, null, null);
                return;
            }

            const hasSku = !!variant.sku;
            if (hasSku) {
                fetchDysonProduct(DEFAULT_COUNTRY, variant.sku).then(data => {
                    updateCardInfo(slot, variant, data);
                });
            } else {
                updateCardInfo(slot, variant, null);
            }
        }

        function wireCard(slot) {
            const cardEl = cards[slot];
            if (!cardEl) return;
            const modelSelect = modelSelects[slot];
            const variantSelect = variantSelects[slot];

            if (modelSelect) {
                modelSelect.addEventListener("change", function() {
                    const modelId = modelSelect.value;
                    selectedVariants[slot] = null;
                    slotBoxItems[slot] = null;
                    stickyState[slot] = null;

                    if (!modelId) {
                        resetVariantSelect(cardEl, true);
                        updateCardInfo(slot, null, null);
                    } else {
                        populateVariantSelect(cardEl, modelId, slot, null);
                        updateCardInfo(slot, null, null);
                    }

                    for (let otherSlot = 1; otherSlot <= MAX_SLOTS; otherSlot++) {
                        if (otherSlot === slot) continue;
                        const otherCard = cards[otherSlot];
                        const otherModelSelect = modelSelects[otherSlot];
                        const otherVariantSelect = variantSelects[otherSlot];
                        if (!otherCard || !otherModelSelect || !otherVariantSelect) continue;
                        const otherModelId = otherModelSelect.value;
                        if (!otherModelId) continue;
                        const preserve = selectedVariants[otherSlot];
                        populateVariantSelect(otherCard, otherModelId, otherSlot, preserve);
                    }

                    renderBestForAccordion();
                    renderBoxAccordion();
                    updateStickyHeader();
                    updateStickyVisibility();
                });
            }

            if (variantSelect && modelSelect) {
                variantSelect.addEventListener("change", function() {
                    const variantId = variantSelect.value || null;
                    const modelId = modelSelect.value;

                    selectedVariants[slot] = variantId;
                    updateProductSummary(slot, modelId, variantId || "");

                    for (let otherSlot = 1; otherSlot <= MAX_SLOTS; otherSlot++) {
                        if (otherSlot === slot) continue;
                        const otherCard = cards[otherSlot];
                        const otherModelSelect = modelSelects[otherSlot];
                        const otherVariantSelect = variantSelects[otherSlot];
                        if (!otherCard || !otherModelSelect || !otherVariantSelect) continue;

                        const otherModelId = otherModelSelect.value;
                        if (!otherModelId) continue;

                        const prevOtherVariantId = otherVariantSelect.value || null;
                        const preserveForOther =
                            prevOtherVariantId && prevOtherVariantId === variantId ?
                            null :
                            prevOtherVariantId;

                        populateVariantSelect(otherCard, otherModelId, otherSlot, preserveForOther);

                        if (prevOtherVariantId && prevOtherVariantId === variantId) {
                            otherVariantSelect.value = "";
                            selectedVariants[otherSlot] = null;
                            updateProductSummary(otherSlot, otherModelId, "");
                        }
                    }

                    renderBestForAccordion();
                });
            }
        }

        // Initial setup
        for (let slot = 1; slot <= MAX_SLOTS; slot++) {
            if (modelSelects[slot]) buildModelOptions(modelSelects[slot], null);
        }

        for (let slot = 1; slot <= MAX_SLOTS; slot++) {
            if (cards[slot]) {
                wireCard(slot);
                updateCardInfo(slot, null, null);
                resetVariantSelect(cards[slot], true);
            }
        }

        if (highlightDiffCheckbox) {
            highlightDiffCheckbox.addEventListener("change", updateHighlightDifferences);
        }
    })();
</script>
