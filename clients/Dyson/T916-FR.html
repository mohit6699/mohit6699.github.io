                    json = null;
                }
                cb(ok, json);
            };
            xhr.open(method, url, true);
            xhr.setRequestHeader("Accept", "application/json");
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.setRequestHeader("x-csrf-token", getCookieVal("CSRF_TOKEN") || "");

        function getAnonCart(guid, cb) {

                "GET",

        /* Deferred commit engine. Clicking an accessory ATB now only queues the SKU (instant). 
           The real cart write happens ONCE, when the user clicks "View basket" (or in the background when the popup is closed). */
        function collectEntryTargets(cart, skus) {
            var targets = [];
            ((cart && cart.entries) || []).forEach(function (e) {
                if (e && e.product && skus.indexOf(e.product.code) > -1 &&
                    e.entryNumber !== undefined && e.entryNumber !== null) {
                    targets.push({
                        sku: e.product.code,
                        entryNumber: e.entryNumber
                    });
                }
            });
            targets.sort(function (a, b) {
                return b.entryNumber - a.entryNumber;
            });
            return targets;
        }

        function deleteEntryTargets(guid, targets, cb) {
            (function next(i) {
                if (i >= targets.length) return cb(true);
                cartRequest(
                    "DELETE",
                    CART_BASE_URL + "users/anonymous/carts/" + guid + "/entries/" +
                    encodeURIComponent(targets[i].entryNumber) + "?lang=" + LANG + "&isBasket=true&t=" + Date.now(), {
                    code: targets[i].sku
                },
                    function (okDel) {
                        if (!okDel) return cb(false);
                        next(i + 1);
                    }
                );
            })(0);
        }

        function prefetchMainEntry(st) {
            var guid = getAnonCartId();
            if (!guid || !st.mainSku) return;

                if (ok && cart) st.mainTargets = collectEntryTargets(cart, [st.mainSku]);
            });

        function postBundleToCart(guid, st, accessorySkus, cb) {
            var entries = [{
                masterProduct: true,
                productCode: st.mainSku,
                bundleId: st.masterTemplateId
            }];

            accessorySkus.forEach(function (sku) {
                entries.push({
                    masterProduct: false,
                    productCode: sku,
                    bundleId: st.templateBySku[sku]
                });
            });

            cartRequest(
                "POST",
                BUNDLE_CART_API + guid + "/entries", {
                bundleNo: "-1",
                entries: entries,
                optOutAutoRegistration: false
            },
                cb
            );
        }

        function canBundle(st, sku) {
            return !!(
                st.active &&
                st.mainSku &&
                !checkLoggedIn() &&
                st.templateBySku[sku] &&
                getAnonCartId()
            );

        function shouldUseBundleCart(sku) {
            return canBundle(bundleState, sku);

        function pendingSkus(st) {
            return st.selected.filter(function (sku) {
                return st.processed.indexOf(sku) === -1;
            });
        }

        function markProcessed(st, skus) {
            skus.forEach(function (sku) {
                if (st.processed.indexOf(sku) === -1) st.processed.push(sku);
            });
        }

        // Regular (non-bundle) adds, one after another
        function addSkusSequentially(st, skus, cb) {
            (function next(i) {
                if (i >= skus.length) return cb();
                addProductToBasket(skus[i], function (ok) {
                    if (ok) markProcessed(st, [skus[i]]);
                    next(i + 1);
                });
            })(0);
        }

        // Swap the standalone main entry for ONE bundle containing main + all accessories
        function commitBundleSkus(st, guid, bundleSkus, cb) {
            var allBundle = st.committed.concat(bundleSkus);

            function postIt() {
                postBundleToCart(guid, st, allBundle, function (ok, json) {
                    if (ok) {
                        st.committed = allBundle;
                        st.mainTargets = null;
                        cb(true);
                        return;
                    }

                    console.warn("[T546] Bundle POST rejected:", allBundle, "| response:", json);

                    // recovery: put the cart back the way it was so the main product isn't lost
                    if (st.committed.length) {
                        postBundleToCart(guid, st, st.committed, function () {
                            cb(false);
                        });
                    } else {
                        addProductToBasket(st.mainSku, function () {
                            cb(false);
                        });
                    }
                });
            }

            var usePrefetched = !st.committed.length && st.mainTargets && st.mainTargets.length;

            if (usePrefetched) {
                deleteEntryTargets(guid, st.mainTargets, function (okDel) {
                    if (!okDel) return cb(false);
                    postIt();
                });
                return;
            }

            // no prefetched entry numbers (or a second commit) -> read the cart once
            getAnonCart(guid, function (ok, cart) {
                if (!ok || !cart) return cb(false);
                var targets = collectEntryTargets(cart, [st.mainSku].concat(st.committed));
                deleteEntryTargets(guid, targets, function (okDel) {
                    if (!okDel) return cb(false);
                    postIt();
                });
            });
        }

        function commitPending(st, cb) {
            if (st.committing) {
                if (cb) st.waiters.push(cb);
                return;
            }

            var pend = pendingSkus(st);
            if (!pend.length) {
                if (cb) cb(true);
                return;
            }

            st.committing = true;

            var guid = getAnonCartId();
            var bundleSkus = [];
            var plainSkus = [];
            pend.forEach(function (sku) {
                (canBundle(st, sku) ? bundleSkus : plainSkus).push(sku);
            });

            function finish(ok) {
                st.committing = false;
                var waiting = st.waiters;
                st.waiters = [];
                if (cb) cb(ok);
                waiting.forEach(function (fn) {
                    fn(ok);
                });
            }

            function doPlain() {
                if (!plainSkus.length) return finish(true);
                addSkusSequentially(st, plainSkus, function () {
                    finish(true);
                });
            }

            if (!bundleSkus.length) return doPlain();

            commitBundleSkus(st, guid, bundleSkus, function (ok) {
                if (ok) {
                    markProcessed(st, bundleSkus);
                    doPlain();
                } else {
                    // last resort: still get the chosen accessories into the cart (at regular price)
                    addSkusSequentially(st, bundleSkus, doPlain);
                }
            });
        }

        function addAccessoryToBasket(btn) {
            if (!btn || btn.disabled) return;

            var st = bundleState;
            var card = btn.closest(".at_recs_card_T546");
            var sku = btn.getAttribute("sku");
            var titleEl = card ? card.querySelector(".plp-cards__name") : null;
            var title = titleEl ? titleEl.textContent.trim() : sku;

            var useBundle = shouldUseBundleCart(sku);

            /* Queue the accessory instead of calling the cart API on every click. */
            var deferred = useBundle || DEFER_STATIC_ACCESSORIES;

            if (deferred) {
                if (st.committing || st.selected.indexOf(sku) > -1) return;

                if (useBundle && BUNDLE_ENFORCE_TEMPLATE_LIMIT) {
                    var tpl = st.templateBySku[sku];
                    if (bundleCountInTemplate(tpl) >= (st.maxByTemplate[tpl] || 1)) return;
                }

                if (typeof s !== "undefined") {
                    s.linkTrackVars = "eVar56";
                    s.eVar56 = "main|modal-product-recommendations|" + title + ",cta,add to basket|button";
                    s.tl(true, "o", s.eVar56);
                }

                if (st.baseCount === null) st.baseCount = parsePopupBasketCount();

                st.selected.push(sku);
                markAccessoryAdded(btn, title);
                updatePopupBasketCount(st);
                updateBundleLimitState();
                return;
            }

            // ---- original immediate behaviour (only reached when DEFER_STATIC_ACCESSORIES = false) ----
            if (typeof s !== "undefined") {
                s.linkTrackVars = "eVar56";
                s.eVar56 = "main|modal-product-recommendations|" + title + ",cta,add to basket|button";
                s.tl(true, "o", s.eVar56);
            }

        function fetchBundleAccessories(bundleId, mainSku) {
            /* Use the session object captured at call time and prefetch the main product's cart entry. */
            var st = bundleState;

            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (this.readyState === 4) {
                    if (this.status === 200) {
                        try {
                            var res = JSON.parse(this.responseText);
                            var productsFound = false;

                            if (res.bundleTemplates && res.bundleTemplates.length > 0) {
                                res.bundleTemplates.forEach(function (template) {
                                    if (template.isMasterTemplate) {
                                        st.masterTemplateId = template.id;
                                        return;
                                    }
                                    if (Array.isArray(template.products)) {
                                        st.maxByTemplate[template.id] = template.maxItemsAllowed || 1;
                                        template.products.forEach(function (bp) {
                                            if (!bp || !bp.code) return;
                                            if (bp.personalizationValidation && bp.personalizationValidation.regularExp) return;
                                            if (!st.templateBySku[bp.code]) {
                                                st.templateBySku[bp.code] = template.id;
                                            }

                                            var product = mapBundleProduct(bp);
                                            addAccessoryCard(product);
                                            productsFound = true;
                                        });
                                    }
                                });
                            }

                            st.active = !!st.masterTemplateId && Object.keys(st.templateBySku).length > 0;

                            /* Warm up the main product's entry number in the background */
                            if (st.active && !checkLoggedIn()) prefetchMainEntry(st);

                            if (!productsFound) loadExistingFallbackLogic(mainSku);

        function updateRecommendationsCarousel() {

            recommendationScrollState.current = Math.min(recommendationScrollState.current, maxIndex);

            if (parts.prev) {
                parts.prev.disabled = recommendationScrollState.current <= 0;
                parts.prev.classList.toggle("at-carousel-disabled_T546", parts.prev.disabled);
            }
            if (parts.next) {
                parts.next.disabled = recommendationScrollState.current >= maxIndex;
                parts.next.classList.toggle("at-carousel-disabled_T546", parts.next.disabled);
            }

            if (parts.dots) {
                parts.dots.innerHTML = "";
                if (items.length > 1) {
                    parts.dots.style.display = "flex";
                    for (var i = 0; i < items.length; i++) {
                        (function (index) {

                                (index === recommendationScrollState.current ? " at-carousel-dot-active_T546" : "");

        function scrollRecommendationsTo(index) {
            var parts = getCarouselParts();
            if (!parts || !parts.list || !parts.list.children[index]) return;

            recommendationScrollState.current = index;
            recommendationScrollState.programmaticTarget = index;
            if (recommendationScrollState.programmaticTimer) clearTimeout(recommendationScrollState.programmaticTimer);

            var item = parts.list.children[index];
            parts.viewport.scrollTo({
                left: item.offsetLeft,
                behavior: "smooth"
            });

            updateRecommendationsCarousel();
            recommendationScrollState.programmaticTimer = setTimeout(function () {
                recommendationScrollState.programmaticTarget = null;
                recommendationScrollState.programmaticTimer = null;

        function initRecommendationsCarousel() {
            var parts = getCarouselParts();
            if (!parts) return;

            if (parts.prev && parts.prev.getAttribute("data-carousel-bound") !== "true") {
                parts.prev.setAttribute("data-carousel-bound", "true");
                parts.prev.addEventListener("click", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (recommendationScrollState.current > 0) scrollRecommendationsTo(recommendationScrollState.current - 1);
                });
            }

            if (parts.next && parts.next.getAttribute("data-carousel-bound") !== "true") {
                parts.next.setAttribute("data-carousel-bound", "true");
                parts.next.addEventListener("click", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var partsNow = getCarouselParts();
                    var count = partsNow && partsNow.list ? partsNow.list.children.length : 0;
                    if (recommendationScrollState.current < count - 1) scrollRecommendationsTo(recommendationScrollState.current + 1);
                });
            }

            if (parts.viewport && parts.viewport.getAttribute("data-drag-bound") !== "true") {
                parts.viewport.setAttribute("data-drag-bound", "true");
                var isDown = false,
                    startX, scrollLeft;

                parts.viewport.addEventListener("mousedown", function (e) {
                    if (e.target.closest("button") || e.target.closest(".dy-tooltip-content_T546")) return;
                    isDown = true;
                    parts.viewport.style.scrollSnapType = "none";
                    startX = e.pageX - parts.viewport.offsetLeft;
                    scrollLeft = parts.viewport.scrollLeft;
                });
                parts.viewport.addEventListener("mouseleave", function () {
                    isDown = false;
                    parts.viewport.style.scrollSnapType = "";
                });
                parts.viewport.addEventListener("mouseup", function () {
                    isDown = false;
                    parts.viewport.style.scrollSnapType = "";
                });
                parts.viewport.addEventListener("mousemove", function (e) {
                    if (!isDown) return;
                    e.preventDefault();
                    var x = e.pageX - parts.viewport.offsetLeft;
                    var walk = (x - startX) * 1.5;
                    parts.viewport.scrollLeft = scrollLeft - walk;
                });
            }

            if (parts.viewport && parts.viewport.getAttribute("data-scroll-bound") !== "true") {
                parts.viewport.setAttribute("data-scroll-bound", "true");
                parts.viewport.addEventListener("scroll", function () {
                    if (!parts.list || !parts.list.children.length || recommendationScrollState.programmaticTarget !== null) return;
                    var viewportCenter = parts.viewport.scrollLeft + (parts.viewport.clientWidth / 2);
                    var closest = 0,
                        distance = Infinity;
                    for (var i = 0; i < parts.list.children.length; i++) {
                        var item = parts.list.children[i];
                        var itemCenter = item.offsetLeft + (item.offsetWidth / 2);
                        var dlt = Math.abs(itemCenter - viewportCenter);
                        if (dlt < distance) {
                            distance = dlt;
                            closest = i;
                        }
                    }
                    recommendationScrollState.current = closest;
                    updateRecommendationsCarousel();
                }, {
                    passive: true
                });
            }
            updateRecommendationsCarousel();
        }

                isAjaxButton = false;

            // Stored to prevent recalculating inside the click listener.
            btn.setAttribute("data-is-ajax", isAjaxButton);

            if (!isAjaxButton) {

                var isExcluded = sku ? (EXCLUDED_SKUS.indexOf(sku) > -1) : false;
                var matched = (!isExcluded) && (isSkuInStaticIds(sku) || bundleId !== null);

                if (isExcluded) {
                    if (!isAjaxBtn) {
                        var fallbackUrl = btn.getAttribute("data-dy-href") || btn.getAttribute("data-href") || btn.getAttribute("href");

                    if (!isAjaxBtn) {

                }

                addProductToBasket(sku, function (ok, addToBasketResponse) {
                    if (ok) fireNativeAtbAnalytics(sku, btn);
                    var basketCount = getBasketCount(addToBasketResponse);
                    console.log("[T546 Flow] Primary Product added to cart. Success:", ok, "| New Basket Count:", basketCount);
                    fetchProductDetails(sku, function (product) {
                        btn.removeAttribute("data-adding");
                        if (ok && product) {
                            renderPopup(product, basketCount, bundleId);
                        } else {
                            console.error("[T546 Error] Could not fetch product details or add product failed. Navigating to /basket");
                            w.location.href = "/basket";
                        }
                    });
                });
            }, true);
        }

        var popupObserver = new MutationObserver(function (mutations) {
            /* The NATIVE modal can also be dismissed without our listeners firing. If accessories are still queued and no popup is visible anymore, write them to the cart in the background. */
            if (bundleState && !bundleState.committing && pendingSkus(bundleState).length) {
                var openPopup = d.querySelector('.centralizedpopup');
                var popupVisible = !!(openPopup &&
                    openPopup.getAttribute('aria-hidden') !== 'true' &&
                    openPopup.querySelector('.add-to-basket-notification__wrapper'));
                if (!popupVisible) flushPendingInBackground();
            }

            var wrapper = d.querySelector('.add-to-basket-notification__wrapper');
            if (wrapper && !wrapper.querySelector('.basket-recommendations_T546')) {
                var activeNativePopup = wrapper.closest('.centralizedpopup');
                if (activeNativePopup && activeNativePopup.getAttribute('aria-hidden') !== 'true') {

                    var skuToUse = w.dyLastClickedSku || getSkuFromPage();
                    var bundleIdToUse = w.dyLastClickedBundleId || null;

                    var isExcluded = skuToUse ? EXCLUDED_SKUS.indexOf(skuToUse) > -1 : false;
                    var isMatched = (!isExcluded) && (isSkuInStaticIds(skuToUse) || bundleIdToUse !== null);

                    // Native modal: base count is read from its "View basket (n)" label on the first accessory click
                    if (skuToUse && isMatched) loadAndRenderAccessories(skuToUse, bundleIdToUse, null);
                }
            }
        });
        popupObserver.observe(d.body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['aria-hidden', 'class']
        });

        setInterval(function () {
            initHeroButtonListener();
        }, 500);
    })(window, document);
</script>
