<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />

<style>
    .closerLook-section {
        width: 100%;
    }

    .closerLook-section__heading_added {
        margin: 0 0 24px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 600;
        color: #111;
    }

    .divider-line__line {
        border: 0;
        border-top: 1px solid #d9d9d9;
        margin: 0 0 32px;
    }

    .closerLook-shell {
        position: relative;
        max-width: 1440px;
        margin: 30px auto;
        min-height: 240px;
    }

    .closerLook-loader {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 20;
    }

    .closerLook-loader.is-hidden {
        display: none;
    }

    .closerLook-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #d9d9d9;
        border-top-color: #111;
        border-radius: 50%;
        animation: closerLookSpin 0.8s linear infinite;
    }

    @keyframes closerLookSpin {
        to {
            transform: rotate(360deg);
        }
    }

    .closerLook-section.swiper-container {
        position: relative;
        width: 90%;
        overflow: hidden;
        opacity: 0;
        margin: 0 auto;
    }

    .closerLook-section .swiper-wrapper {
        padding-left: 0 !important;
        list-style: none;
    }

    @media (min-width: 768px) {
        .closerLook-section .swiper-wrapper {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 24px;
            row-gap: 24px;
            padding: 0;
            margin: 0;
            list-style: none;
            /* transform: none !important; */
        }

        .closerLook-section .swiper-slide {
            margin: 0 !important;
            list-style: none;
            box-sizing: border-box;
            height: auto;
            display: flex;
            flex-direction: column;
        }
    }

    @media (min-width: 1024px) {
        .swiper-slide {
            display: none;
        }
    }

    .closerLook-section .imageContainer {
        width: 100%;
        margin-bottom: 12px;
        border-radius: 4px;
        overflow: hidden;
        background: #f5f5f5;
    }

    .closerLook-section .imageContainer img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
    }

    .closerLook-section .textContainerOne {
        display: flex;
        flex-direction: column;
        flex: 1;
    }

    .closerLook-section .title {
        font-size: 18px;
        font-weight: 500;
        color: #333;
        line-height: 1.3;
    }

    .closerLook-section .description {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        color: #595959;
        flex-grow: 1;
    }

    .swiper-button-prev,
    .swiper-button-next {
        display: none;
    }

    @media (max-width: 767px) {
        .closerLook-section .swiper-slide {
            flex-shrink: 0.09 !important;
        }

        .closerLook-section__heading_added {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .closerLook-shell {
            width: 100%;
            margin: 30px 0;
            min-height: 320px;
        }

        .closerLook-section.swiper-container {
            overflow: hidden;
            box-sizing: border-box;
            margin-left: 5%;
            width: 100%;
        }

        .closerLook-section .swiper-wrapper {
            display: flex;
            gap: 0;
        }

        .closerLook-section .imageContainer {
            margin-bottom: 10px;
        }

        .closerLook-section .title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            line-height: 1.3;
        }

        .swiper-button-prev,
        .swiper-button-next {
            position: absolute;
            top: 40%;
            z-index: 10;
            width: 32px;
            height: 32px;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 50%;
            color: #111;
        }

        .swiper-button-prev {
            right: auto;
            left: auto;
        }

        .swiper-button-next {
            right: 30px;
            left: auto;
        }

        .swiper-button-prev:after,
        .swiper-button-next:after {
            font-size: 14px;
            font-weight: 700;
        }
    }

    .closerLook-card:hover {
        text-decoration: none;
    }


    .swiper-button-prev.swiper-button-disabled,
    .swiper-button-next.swiper-button-disabled {
        visibility: hidden;
    }

    .closerLook-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        text-decoration: none;
        color: inherit;
    }

    .textContainerOne {
        display: flex;
        flex-direction: column;
    }

    .shopNowCta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: auto;
        padding-top: 16px;
        text-decoration: none;
        color: inherit;
        font-weight: 500;
        cursor: pointer;
    }

    .shopNowArrow {
        font-size: 20px;
        line-height: 0;
    }

    .borderColorBlack>div:nth-child(2) {
        display: none;
    }
</style>

<script>
    var matchtextContainerOneHeight = function() {
        var titles = document.querySelectorAll('.textContainerOne .title');
        var descs = document.querySelectorAll('.textContainerOne .description');

        if (!titles.length) return;

        titles.forEach(function(item) {
            item.style.height = 'auto';
        });

        var maxTitleHeight = 0;
        titles.forEach(function(item) {
            maxTitleHeight = Math.max(maxTitleHeight, item.offsetHeight);
        });

        titles.forEach(function(item) {
            item.style.height = maxTitleHeight + 'px';
        });

        descs.forEach(function(item) {
            item.style.height = 'auto';
        });

        var maxDescHeight = 0;
        descs.forEach(function(item) {
            maxDescHeight = Math.max(maxDescHeight, item.offsetHeight);
        });

        descs.forEach(function(item) {
            item.style.height = maxDescHeight + 'px';
        });
    };

    var hideCloserLookLoader = function() {
        var loader = document.querySelector('.closerLook-loader');
        var section = document.querySelector('.closerLook-section.swiper-container');

        if (section) {
            section.style.opacity = '1';
        }
        if (loader) {
            loader.classList.add('is-hidden');
        }
    };

    var bindSwiperArrowLogs = function(swiperInstance) {
        var prevBtn = document.querySelector('.closerLook-section .swiper-button-prev');
        var nextBtn = document.querySelector('.closerLook-section .swiper-button-next');

        if (prevBtn && !prevBtn.dataset.logBound) {
            prevBtn.addEventListener('click', function() {
                if (typeof s !== "undefined") {
                    s.linkTrackVars = "eVar56";
                    s.eVar56 = "Just Released| prev-btn| HP";
                    s.tl(true);
                }
                // console.log('Closer Look swiper: previous arrow clicked, active index:', swiperInstance.activeIndex);
            });
            prevBtn.dataset.logBound = 'true';
        }

        if (nextBtn && !nextBtn.dataset.logBound) {
            nextBtn.addEventListener('click', function() {
                if (typeof s !== "undefined") {
                    s.linkTrackVars = "eVar56";
                    s.eVar56 = "Just Released| next-btn| HP";
                    s.tl(true);
                }
                //console.log('Closer Look swiper: next arrow clicked, active index:', swiperInstance.activeIndex);
            });
            nextBtn.dataset.logBound = 'true';
        }
    };

    var loadcarouselCloserLook = function() {
        setTimeout(function() {
            if (window.innerWidth <= 767) {
                const swiper = new Swiper(".closerLook-section.swiper-container", {
                    slidesPerView: 1.35,
                    spaceBetween: 16,
                    autoHeight: true,
                    preloadImages: true,
                    centeredSlides: false,
                    initialSlide: 0,
                    speed: 600,
                    loop: false,
                    navigation: {
                        nextEl: ".swiper-button-next",
                        prevEl: ".swiper-button-prev"
                    },
                    on: {
                        init: function() {
                            matchtextContainerOneHeight();
                            hideCloserLookLoader();
                            bindSwiperArrowLogs(this);
                            //clearInterval(loadcarouselCloserLook);
                        },
                        imagesReady: function() {
                            matchtextContainerOneHeight();
                        },
                        resize: function() {
                            matchtextContainerOneHeight();
                        },
                        touchEnd: function () {
                            setTimeout(function () {
                                swiper.swipeDirection = undefined;
                            }, 0);
                        },
                        slideChange: function() {
                            let direction = swiper.swipeDirection === "next" ? "Just Released| swipe-next" : "Just Released| swipe-prev";
                            if (typeof s !== "undefined" && swiper.swipeDirection && typeof dataLayer !== "undefined" && dataLayer.pageInfo && dataLayer.pageInfo.pageTitle) {
                                s.linkTrackVars = "eVar56";
                                s.eVar56 = direction + "| HP";
                                s.tl(true, "o", direction + "| HP");
                            }
                        }
                    }
                });
            } else {
                matchtextContainerOneHeight();
                hideCloserLookLoader();
            }
        }, 1000);
    };

    var learnSlideData = [{
            title: "Dyson V8 Cyclone",
            desc: "30% more power.⁹ 60 minute run time.* No loss of suction.¹⁰",
            desktopSrc: "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/campaigns/homepage-redesign/v8_partial_width_desktop.jpg",
            mobileSrc: "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/campaigns/homepage-redesign/v8_partial_width_mobile.jpg",
            href: "https://www.dyson.com/vacuum-cleaners/cordless/v8-cyclone/motorbar",
            evar56: "just-released-v8-image~cta",
            shopNowEvar56: "just-released-v8-shopnow~cta"
        },
        {
            title: "Dyson V10 Konical",
            desc: "Powerful fade-free suction. De-tangles long hair.³  Illuminates dust.",
            desktopSrc: "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/campaigns/homepage-redesign/v10_partial_width_desktop.jpg",
            mobileSrc: "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/campaigns/homepage-redesign/v10_partial_width_mobile.jpg",
            href: "https://www.dyson.com/vacuum-cleaners/cordless/v10-konical/black-copper",
            evar56: "just-released-pencilwash-image~cta",
            shopNowEvar56: "just-released-pencilwash-shopnow~cta"
        }
    ];

    (function() {
        var counter = 0;
        var slidesHtml = "";
        var isMobile = window.innerWidth <= 767;

        learnSlideData.forEach(function(element) {
            var imageSrc = isMobile ? element.mobileSrc : element.desktopSrc;

            slidesHtml +=
                '<li class="swiper-slide">' +
                '<a href="' + element.href + '" class="closerLook-card" data-analytics-action-name="' + element.evar56 + '">' +
                '<div class="imageContainer">' +
                '<img src="' + imageSrc + '" alt="' + element.title + '">' +
                '</div>' +
                '<div class="textContainerOne">' +
                '<h3 class="title">' + element.title + '</h3>' +
                '<p class="description">' + element.desc + '</p>' +

                '</div>' +
                '</a>' +
                '<span class="shopNowCta" onclick="handleShopNowClick(\'' + element.shopNowEvar56 + '\', \'' + element.href + '\')">Shop now <span class="shopNowArrow">&#8594;</span></span>' +
                '</li>';
        });

        var closerLookHtml =
            '<div class="closerLook-shell">' +
            '<div class="closerLook-loader"><div class="closerLook-spinner"></div></div>' +
            '<div class="closerLook-section swiper-container">' +
            '<h3 class="h3 closerLook-in-the-box__heading_added">Just released</h3>' +
            '<ul class="swiper-wrapper">' +
            slidesHtml +
            '</ul>' +
            '<div class="swiper-button-prev"></div>' +
            '<div class="swiper-button-next"></div>' +
            '</div>' +
            '</div>';

        var waitForElement = function() {
            var target = document.querySelector(".image-carousel.parbase");

            if (target) {
                target.insertAdjacentHTML("afterend", closerLookHtml);
                //setInterval(loadcarouselCloserLook,1000);
                setTimeout(function() {
                    loadcarouselCloserLook();
                }, 2000);
            } else {
                counter += 1;
                if (counter < 100) {
                    setTimeout(waitForElement, 300);
                }
            }
        };

        window.handleShopNowClick = function(evar56, href) {


            if (typeof s !== "undefined") {
                s.linkTrackVars = "eVar56";
                s.eVar56 = evar56;
                s.tl(true, "o", evar56);
            }
            window.location.href = href;
        }

        waitForElement();

        window.addEventListener('resize', function() {
            matchtextContainerOneHeight();
        });
    })();
</script>
