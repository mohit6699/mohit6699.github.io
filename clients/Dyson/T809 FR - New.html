        .atSignupPopupImg {

        .atSignupPopup .atSignupPopupContent h2 {
            padding-top: 15px !important;

        .atSignupPopupContent p {

        .forms-group.js-form-group.forms-group--reset-mobile.forms--error {
            margin-bottom: 20px !important;
        }

        .atSignupPopupImg {
            height: 470px;
        }

        .atSignupPopupImg .atClose {
            right: 15px;
        }

        .atpopupImg {
            width: 100%;
            left: 0;
            height: 470px;
        }

        .atClose.mobile {
            display: none;
        }

        .atClose.desktop {
            display: block;
            filter: brightness(5);
        }
    }

    @media screen and (min-width: 1023px) {
        .atSignupPopup {
            flex-direction: row;
        }

        .atSignupPopupContent {
            width: 470px;
            height: 470px;
            padding: 30px;
        }

        .atSignupPopupContent h2 {
            padding-top: 15px !important;
        }

        .atSignupPopupContent p {
            margin-bottom: 25px !important;
            margin-top: 15px !important;
            font-size: 15px !important;
            line-height: 1.4 !important;
        }

        .forms-group.js-form-group.forms-group--reset-mobile.forms--error {
            margin-bottom: 20px !important;
        }

        .atSignupPopupImg {
            height: 470px;
        }

        .atpopupImg {
            width: 470px;
            left: 0;
            height: 470px;
        }

        .atClose.mobile {
            display: none;
        }

        .atClose.desktop {
            display: block;
        }

    }

    .adb-offer-div {
        display: flex;
        justify-content: center;
        padding: 10px;
        width: 100%;
        margin: 7.5rem 0 3rem 0;
        border: 2px solid #D2D2D2;
        cursor: pointer !important;
        background-color: #F9F9F9;
        border-radius: 5px;
    }

    @media screen and (max-width: 1024px) {
        .adb-offer-div {
            margin: 2.5rem 0 0rem 0;
        }
    }

    .adb-offer-icon {
        width: 25px;
        height: 25px;
        margin-right: 10px;
    }

    .adb-offer-text {
        margin-top: auto;
        margin-bottom: 0px !important;
    }

    .adb-offer-link {
        font-weight: 500 !important;
        text-decoration: underline !important;
    }

    .tapToCopy-btn {
        display: flex;
        align-items: center;
        background-color: lightgrey;
        color: #000;
        margin: 20px;
        padding: 7.5px 20px;
        border-radius: 5px 5px;
        cursor: pointer;
        border: 0;
        font-size: large;
    }

    .adb-btn-clicked {
        display: flex;
        align-items: center;
        background-color: #1C1C1C;
        color: #fff;
        margin: 20px;
        padding: 7.5px 20px;
        border-radius: 5px 5px;
        border: 0;
        font-size: large;
    }

    .product-hero__cta-container {
        flex-direction: column !important;
        padding-left: 0px !important;
        padding-right: 0px !important;
    }

    .js-slider-text {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .js-slider-text h2 {
        font-size: 1.25rem;
        text-align: center;
        font-weight: 500;
    }

    .adb-coupon-code {
        color: #0066CC;
        font-size: 2.25rem;
        margin-top: 0.5rem;
    }

    .adb-btn-icon {
        width: 2rem;
        margin: 7.5px 15px 7.5px 0px;
    }
</style>
<script>
    var modalPopup =
        '<div class="atSignupPopup">' +
        '<div class="atSignupPopupContent" data-analytics-component="subs-component" data-analytics-action-title="subscription">' +
        '<a tabindex="0" class="pop-up-close-btn atClose-link" href="#0" data-analytics-action-name="button~close" name="close">' +
        '<img src="https://cimage.adobe.com/dyson/images/Close-Icon.png" class="atClose mobile">' +
        '</a>' +
        '<div class="js-slider-text">' +
        '<h2 style="padding-top: 15px;">Jusqu\'à 10% de réduction, cumulables avec nos offres en cours.</h2>' +
        '</div>' +
        '<div class="js-slider-prev popuptracking" data-analytics-nav-type="pop-up thankyou" data-analytics-nav-location="submit pop up" style="display:none;"></div>' +
        '<p style="margin-bottom: 25px; margin-top: 20px;">Recevez des informations exclusives sur toutes nos dernières technologies, nos offres sur Dyson.fr ou en Demo Stores, et bien d’autres avantages.</p>' +
        '<form id="atSignupPopupForm" method="post" action="javascript:void(0)" name="marketing-form-7ecb487976bb45fd8f59bb99bcffc2d9" class="js-forms" data-async-submit="" data-analytics-action-title="no_heading" novalidate="novalidate">' +
        '<div class="text">' +
        '<div class="form_row">' +
        '<div class="">' +
        '<div class="forms-group js-form-group forms-group--reset-mobile">' +
        '<div class="forms-errortext js-form-error"></div>' +
        '<div class="forms-control js-form-control form_rightcol_wrapper">' +
        '<input id="email_7ecb487976bb45fd8f59bb99bcffc2d9" ' +
        'type="text" ' +
        'name="email_address" ' +
        'class="forms-text text-area-new js-forms-text form_field form_field_text" ' +
        'aria-required="true" ' +
        'aria-invalid="false">' +
        '<label for="email_7ecb487976bb45fd8f59bb99bcffc2d9" class="forms-label forms-label--overlay"> E-mail * </label>' +
        '</div>' +
        '</div>' +
        '</div>' +
        '</div>' +
        '</div>' +
        '<div>' +
        '<div class="policy_container">' +
        'Vous pouvez vous désinscrire à tout moment et facilement, ou simplement modifier la fréquence de contact. Nous expliquons comment nous utilisons vos données personnelles dans notre ' +
        '<a class="privacy-policy" href="https://www.dyson.fr/a-propos-de-dyson/conditions-generales/conditions-generales" data-analytics-action-name="link~policy" name="policy">politique de confidentialité.</a>.' +
        '</div>' +
        '</div>' +
        '<div class="hidden-xs-up"><input type="hidden" name="campaign_id" value="FR-Always-on-prospects"></div>' +
        '<div class="hidden-xs-up"><input type="hidden" name="form_name" value="FR-Always-on-prospects"></div>' +
        '<div class="hidden-xs-up"><input type="hidden" name="preferred_language" value="fr"></div>' +
        '<div class="hidden-xs-up"><input type="hidden" name="market" value="FR"></div>' +
        '<div class="hidden-xs-up">' +
        '<input type="hidden" name="channel_id" class="js-marketing-form-query-string-field" data-query-string-param="channel_id" data-default-value="WEB" max-length="40">' +
        '</div>' +
        '<div>' +
        '<a class="submission" href="#" data-analytics-action-name="button~submit" name="submit">' +
        '<div class="button button--interactive button--large js-disabled-forms-submit-button" type="button" name="Submit" value="Submit" style="width: 100%;"> S\'inscrire </div>' +
        '</a>' +
        '</div>' +
        '</form>' +
        '</div>' +
        '<div class="atSignupPopupImg">' +
        '<a tabindex="0" class="pop-up-close-btn atClose-link" href="#0" data-analytics-action-name="button~close" name="close">' +
        '<img tabindex="0" src="https://cimage.adobe.com/dyson/images/Close-Icon.png" class="atClose desktop" data-analytics-action-name="button~close">' +
        '</a>' +
        '<img src="https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/images/sign-up/XCat_Lounge_Editorial_Imagery_Q1_2021_CF06_HP07_SV22HEPA.jpg" class="atpopupImg">' +
        '</div>' +
        '</div>';

    var btnClicked = false;

    (function () {
        var counter = 0;
        var newSession = "${user.isNewSession}";

        if (!localStorage.getItem('clikedCloseSess')) {
            localStorage.setItem('clikedCloseSess', '1');
        }

        function validateEmailField() {
            var emailInput = document.getElementById('email_7ecb487976bb45fd8f59bb99bcffc2d9');
            var group = document.querySelector('#atSignupPopupForm .forms-group');
            var errorBox = document.querySelector('#atSignupPopupForm .forms-errortext');

            if (!emailInput || !group || !errorBox) {
                return false;
            }

            var value = emailInput.value || "";
            value = value.replace(/^\s+|\s+$/g, "");

            errorBox.innerHTML = "";
            group.className = group.className.replace(/\bforms--error\b/g, "").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");


            if (!value) {
                errorBox.innerHTML = "Entrez votre adresse email";
                group.className += " forms--error";
                return false;
            }


            if (value.length > 80) {
                errorBox.innerHTML = "Veuillez saisir un maximum de 80 caractères";
                group.className += " forms--error";
                return false;
            }

            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(value)) {
                errorBox.innerHTML = "Entrez une adresse email valide";
                group.className += " forms--error";
                return false;
            }

            return true;
        }

        function signupModal() {
            var header = document.querySelector("header");
            if (!header) {
                return;
            }
            header.insertAdjacentHTML("afterend", modalPopup);

            var emailInput = document.getElementById('email_7ecb487976bb45fd8f59bb99bcffc2d9');

            if (emailInput) {
                emailInput.addEventListener('input', function () {
                    var group = document.querySelector('#atSignupPopupForm .forms-group');
                    var errorBox = document.querySelector('#atSignupPopupForm .forms-errortext');
                    if (group && errorBox) {
                        errorBox.innerHTML = "";
                        group.className = group.className.replace(/\bforms--error\b/g, "").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
                    }
                });
            }

            function formSub() {
                var emailValEl = document.getElementById('email_7ecb487976bb45fd8f59bb99bcffc2d9');
                var emailVal = emailValEl ? emailValEl.value : "";

                var data = {
                    email_address: emailVal,
                    prospect_consent: "Yes",
                    campaign_id: "FR-Always-on-prospects",
                    form_name: "FR-Always-on-prospects",
                    preferred_language: "fr",
                    market: "FR",
                    channel_id: "WEB",
                    time_stamp: (new Date()).toISOString()
                };

                var requestBody = new URLSearchParams(data).toString();

                fetch("https://api.dyson.fr/apiman-gateway/dyson/aemforms/1.0/", {
                    headers: {
                        "accept": "*/*",
                        "content-type": "application/x-www-form-urlencoded"
                    },
                    referrer: "https://www.dyson.fr/fr",
                    referrerPolicy: "strict-origin-when-cross-origin",
                    body: requestBody,
                    method: "POST"
                }).then(function () {
                    $('.atSignupPopupContent h2').html('Merci pour votre inscription! Votre code pour bénéficier d&#39;une réduction allant jusqu&#39;à 10% sur votre première commande :');

                    if (!btnClicked) {
                        document.querySelector('.atSignupPopupContent h2').insertAdjacentHTML(
                            'afterend',
                            '<label class="adb-coupon-code">WELCOME</label><button class="tapToCopy-btn" data-analytics-action-name="copy-coupon"><img src="https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/misc/Copy-icon.png?fmt=png-alpha" class="adb-btn-icon">Copier le code</button>'
                        );
                    } else {
                        document.querySelector('.atSignupPopupContent h2').insertAdjacentHTML(
                            'afterend',
                            '<label class="adb-coupon-code">WELCOME</label><button class="adb-btn-clicked"><img src="https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/leap-petite-global/apac-dd/tick.png?fmt=png-alpha" class="adb-btn-icon">Copié</button>'
                        );
                    }

                    $('.atSignupPopupContent').addClass('atFormSubmitted');

                    var element = document.querySelector('.atSignupPopupContent .js-slider-text h2');
                    var thankyouText = 'Merci pour votre inscription!';

                    if (element && element.innerHTML.indexOf(thankyouText) !== -1 && !btnClicked) {
                        var tapToCopyBtn = document.querySelector('.tapToCopy-btn');
                        tapToCopyBtn.addEventListener('click', function () {
                            var name = "copy-coupon";
                            if (window.s_gi) {
                                var s = s_gi('dysonfrprod');
                                s.linkTrackVars = "eVar56";
                                s.eVar56 = name;
                                s.tl(true, "o", name);
                            }

                            btnClicked = true;
                            navigator.clipboard.writeText('WELCOME');
                            tapToCopyBtn.innerHTML = '<img src="https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/misc/Tick-icon.jpg" class="adb-btn-icon">Copié';
                            tapToCopyBtn.classList.add('adb-btn-clicked');
                            tapToCopyBtn.classList.remove('tapToCopy-btn');
                            adobe.target.trackEvent({
                                "mbox": "mboxClickTrack",
                                "params": {
                                    "clicked": "copy-coupon"
                                }
                            });
                        });

                        $('.atSignupPopupContent .popuptracking').click();
                    }

                    adobe.target.trackEvent({
                        "mbox": "mboxClickTrack",
                        "params": {
                            "clicked": "incentive-signup"
                        }
                    });
                    adobe.target.trackEvent({
                        "mbox": "mboxClickTrack",
                        "params": {
                            "profile.emailSubmit": "submitted"
                        }
                    });

                    setTimeout(function () {
                        document.querySelector('.atSignupPopup').style.display = "none";
                    }, 60000);
                }).catch(function () {
                    $('.atSignupPopupContent h1').html('Unknown error');
                    setTimeout(function () {
                        document.querySelector('.atSignupPopup').style.display = "none";
                    }, 60000);
                });
            }


            $('#atSignupPopupForm .submission').on('click', function (e) {
                e.preventDefault();

                var ok = validateEmailField();
                if (!ok) {
                    return;
                }

                formSub();
            });


            $('#email_7ecb487976bb45fd8f59bb99bcffc2d9').on('keypress', function (e) {
                var key = e.key || e.which;
                if (key === "Enter" || key === 13) {
                    e.preventDefault();
                    var ok = validateEmailField();
                    if (!ok) {
                        return;
                    }
                    formSub();
                }
            });

            $('.atSignupPopup .atClose-link').click(function () {
                localStorage.setItem('clikedCloseSess', '3');
                adobe.target.trackEvent({
                    "mbox": "mboxClickTrack",
                    "params": {
                        "clicked": "incentive-learnmore_PopUpClosed_EXP-B"
                    }
                });
                document.querySelector('.atSignupPopup').style.display = "none";
            });


            $(document).on('click', '.atSignupPopup', function (e) {
                if ($(e.target).closest('.atSignupPopupContent').length === 0 &&
                    $(e.target).closest('.atSignupPopupImg').length === 0) {
                    $('.atSignupPopup').hide();
                }
            });


            $('.atSignupPopupContent .privacy-policy').click(function () {
                adobe.target.trackEvent({
                    "mbox": "mboxClickTrack",
                    "params": {
                        "clicked": "privacyPolicy_EXP-B"
                    }
                });
            });


            $(document).click(function (e) {
                if ($(e.target).is('.popuptracking')) {
                    return;
                }
                var $target = $(e.target);
                var popupContent = $(".atSignupPopupContent,.atSignupPopupContent h2,.atSignupPopupContent p,.atSignupPopupContent form,.atSignupPopupContent form div,.atSignupPopupContent form div input,.atSignupPopupContent form button,.atSignupPopupContent form span,.atSignupPopupImg .atpopupImg");
                if (!$target.is(popupContent)) {
                    if ($('.atSignupPopup.at-element-marker').is(':visible')) {
                        $('.atSignupPopup.at-element-marker').hide();
                    }
                }
            });
        }


        function waitForjQuery() {
            var imageSelector = document.querySelector(".product-hero__bottom-section");
            var offerText =
                '<a class="adb-offer-div" data-analytics-action-name="incentive-signup~cta" tabindex="0">' +
                '<img src="https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/misc/e-mail-icon-dark.png?fmt=png-alpha" class="adb-offer-icon">' +
                '<p class="adb-offer-text"><span class="adb-offer-link">Inscrivez-vous </span>pour bénéficier d&#39;une réduction allant jusqu&#39;à 10% de réduction sur votre première commande</p>' +
                '</a>';

            if (imageSelector != null) {
                imageSelector.insertAdjacentHTML("afterend", offerText);
                var learnMoreClick = document.querySelector(".adb-offer-div");
                learnMoreClick.addEventListener('click', function (e) {
                    e.preventDefault();
                    var name = "incentive-signup~cta";
                    if (window.s_gi) {
                        var s = s_gi('dysonfrprod');
                        s.linkTrackVars = "eVar56";
                        s.eVar56 = name;
                        s.tl(true, "o", name);
                    }

                    signupModal();
                });
            } else {
                counter++;
                if (counter < 150) {
                    setTimeout(function () {
                        waitForjQuery();
                    }, 300);
                }
            }
        }

        waitForjQuery();
    })();
</script>
