<script type="text/javascript">
    if (!Element.prototype.matches) {
        Element.prototype.matches =
            Element.prototype.msMatchesSelector ||
            Element.prototype.webkitMatchesSelector;
    }
    if (!Element.prototype.closest) {
        Element.prototype.closest = function(s) {
            var el = this;
            do {
                if (el.matches(s)) return el;
                el = el.parentElement || el.parentNode;
            } while (el !== null && el.nodeType === 1);
            return null;
        };
    }

    var matchHeight = function() {
        /*name height*/
        //var names = document.querySelectorAll('.at_recs_card_T546 .plp-cards__name'), desc = document.querySelectorAll('.at_recs_card_T546 .plp-cards__description');
        if (window.innerWidth > 768) {
            var max = 0;
            var names = document.querySelectorAll(".plp-cards__text-container");
            for (var i = names.length - 1; i >= 0; i--) {
                max = names[i].offsetHeight > max ? names[i].offsetHeight : max;
            }
            for (var i = names.length - 1; i >= 0; i--) {
                names[i].style.minHeight = max + "px";
            }
        }
    };
</script>

        function addToCart(e) {
            e.stopPropagation();
            e.preventDefault();
            var btn = e.target;
            jQuery(btn)
                .parents(".at_recs_card_T546.plp-cards__item.js-plp-cards-item")
                .addClass("active");

            var sku = this.getAttribute("sku");
            var productTitle = btn.parentElement.parentElement.parentElement.parentElement.parentElement.querySelector('.plp-cards__name').textContent;
            if (typeof s !== "undefined") {
                s.linkTrackVars = "eVar56";
                s.eVar56 = 'main|modal-product-recommendations|' + productTitle + ',cta,add to basket|button';
                s.tl(true, "o", 'main|modal-product-recommendations|' + productTitle + ',cta,add to basket|button');
            }
            var xhttp = new XMLHttpRequest();
            xhttp.withCredentials = true;
            var url = "";
            if (btn && btn.getAttribute("data-basket-processing-button-text")) {
                btn.className =
                    "button--transactional button--fluid active at_target_T546";
                btn.innerHTML = btn.getAttribute("data-basket-processing-button-text");
                btn.setAttribute("disabled", true);
            }
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status === 200) {
                    //Refresh window

                    var res = JSON.parse(this.responseText);
                    //console.log('ADDTOBASKET', typeof res, this.responseText);
                    if (typeof res === "object") {
                        if (res.statusCode === "success") {
                            if (btn) {
                                btn.innerHTML = "&nbsp";
                                btn.className =
                                    "button--transactional button--fluid completed_T791 active at_target_T546";
                            }
                            setTimeout(function() {
                                handleSuccessResponse();
                                //window.location.reload();
                            }, 500);
                        }
                    }
                } else if (this.readyState === 4 && this.status !== 200) {
                    if (btn && btn.getAttribute("data-basket-processing-button-text")) {
                        btn.className = "button--transactional at_target_T546";
                        btn.innerHTML = "Add to cart";
                        btn.removeAttribute("disabled");
                    }
                }
            };
            var product = JSON.stringify({
                product: {
                    code: sku
                },
                quantity: 1
            });
            if (checkLoggedIn()) {
                url =
                    window.CART_BASE_URL_T546 +
                    "users/" +
                    dataLayer.customer.credentialID +
                    "/carts/current";
            } else {
                //Not logged In
                var cartId = getCookieVal("cartguid");
                if (cartId) {
                    url =
                        window.CART_BASE_URL_T546 +
                        "users/anonymous/carts/" +
                        cartId.replace(/\"/g, "") +
                        "/entries";
                } else {
                    //create new cart
                    url =
                        window.CART_BASE_URL_T546 + "users/anonymous/carts/createCart?lang=en";
                }
            }
            xhttp.open("POST", url + ("?code=" + sku + "&lang=en"), true);
            xhttp.setRequestHeader("Accept", "application/json");
            xhttp.setRequestHeader("Content-type", "application/json");
            //xhttp.setRequestHeader("Cookie", ("CSRF_TOKEN=" + getcsrf() + ";path=www.dyson.com"));
            xhttp.setRequestHeader("x-csrf-token", getCookieVal("CSRF_TOKEN") || "");

            xhttp.send(product);
        }

        function loadEmbla(callback) {
            if (typeof window.EmblaCarousel === "function") {
                callback();
                return;
            }

            emblaLoadCallbacks.push(callback);

            if (emblaLoading) {
                return;
            }

            emblaLoading = true;

            var existingScript = document.querySelector(
                'script[data-t546-embla="true"]'
            );

            if (existingScript) {
                existingScript.addEventListener("load", function() {
                    emblaLoading = false;

                    var callbacks = emblaLoadCallbacks.slice();
                    emblaLoadCallbacks = [];

                    for (var i = 0; i < callbacks.length; i++) {
                        callbacks[i]();
                    }
                }, {
                    once: true
                });

                return;
            }

            var script = document.createElement("script");

            script.src = EMBLA_CDN;
            script.async = true;
            script.setAttribute("data-t546-embla", "true");

            script.onload = function() {
                emblaLoading = false;

                var callbacks = emblaLoadCallbacks.slice();
                emblaLoadCallbacks = [];

                for (var i = 0; i < callbacks.length; i++) {
                    callbacks[i]();
                }
            };

            script.onerror = function() {
                emblaLoading = false;
                emblaLoadCallbacks = [];

                console.error(
                    "T546: Unable to load Embla Carousel."
                );
            };

            document.head.appendChild(script);
        }

                    "data-embla-event-added"
                ) !== "true"
            ) {
                nextBtn.setAttribute(
                    "data-embla-event-added",
                    "true"
                );

                nextBtn.addEventListener("pointerdown", function(event) {
                    event.stopPropagation();
                    carouselInteractionType = "next-arrow";
                });

                nextBtn.addEventListener("click", function(event) {
                    event.preventDefault();
                    event.stopPropagation();

                    if (recsEmblaApi) {
                        carouselInteractionType = "next-arrow";

                        trackCarouselEvar("next-arrow");

                        recsEmblaApi.goToNext();
                    }
                });
            }
        }

        function attachEmblaEvents() {
            if (!recsEmblaApi) {
                return;
            }

            recsEmblaApi.on(
                "pointerdown",
                function() {
                    carouselInteractionType = "swipe";
                }
            );

            recsEmblaApi.on(
                "select",
                function(emblaApi, event) {
                    var sourceSnap = event.detail.sourceSnap;
                    var targetSnap = event.detail.targetSnap;

                    if (carouselInteractionType === "swipe") {
                        if (targetSnap > sourceSnap) {
                            onSwipeLeft();
                        } else if (targetSnap < sourceSnap) {
                            onSwipeRight();
                        }
                    }

                    updateCarouselUI();

                    carouselInteractionType = null;
                }
            );
        }

        function destroyCarousel() {
            if (recsEmblaApi) {
                recsEmblaApi.destroy();
            }

            recsEmblaApi = null;
            recsEmblaViewport = null;
        }

        function initOrUpdateCarousel() {
            loadEmbla(function() {
                addEmblaStyles();

                var viewport = ensureEmblaViewport();
                var container = getCarouselContainer();

                if (!viewport || !container) {
                    if (
                        recsEmblaApi &&
                        recsEmblaViewport &&
                        !document.documentElement.contains(
                            recsEmblaViewport
                        )
                    ) {
                        destroyCarousel();
                    }

                    return;
                }

                addCarouselControlsMarkup();

                if (
                    recsEmblaApi &&
                    recsEmblaViewport !== viewport
                ) {
                    destroyCarousel();
                }

                if (!recsEmblaApi) {
                    recsEmblaViewport = viewport;

                    recsEmblaApi = window.EmblaCarousel(
                        viewport, {
                            loop: false,
                            align: "start",
                            containScroll: "trimSnaps",
                            slidesToScroll: 1,
                            watchDrag: true,
                            watchResize: true,
                            watchSlides: true
                        }
                    );

                    recsEmblaApi.on(
                        "reInit",
                        function() {
                            renderCarouselDots();
                            updateCarouselUI();
                        }
                    );

                    attachCarouselButtonEvents();
                    attachEmblaEvents();
                } else {
                    recsEmblaApi.reInit();
                }

                renderCarouselDots();
                updateCarouselUI();
            });
        }

        function addCarouselControls() {
            initOrUpdateCarousel();
        }

        function randomiseArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }

        function isFinishedGoods(productSku, callback) {
            var xhr = new XMLHttpRequest();

            xhr.open(
                "GET",
                "https://api.dyson.com/apiman-gateway/dyson/product/1.0/us/" + productSku,
                true
            );

            xhr.setRequestHeader("Accept", "application/json");

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var product = JSON.parse(xhr.responseText);

                        callback(
                            product.sapDivision &&
                            product.sapDivision === "FINISHED_GOODS"
                        );
                    } else {
                        callback(false);
                    }
                }
            };

            xhr.send();
        }

        function checkDatalayer(PDPproductId) {
            /* if (dataLayer && dataLayer.products && dataLayer.products.length > 0) {
                 var products = dataLayer.products || [];*/
            if (PDPproductId) {
                var products = PDPproductId;

                // Extract the SKU key from each array entry (ignoring the text fields)
                var statKeys = window.staticIds.map(function(item) {
                    return Object.keys(item).find(function(k) {

                    });
                });
                isFinishedGoods("408108-01", function(isFinished) {

                        if (

                                    "afterend",
                                    document.getElementById("at_template_recs_T546").innerHTML
                                );


                            // Find the matching entry object in the array
                            var staticEntry = window.staticIds.find(function(item) {
                                return item[sku] !== undefined;
                            });

                            if (staticEntry) {
                                fetchStaticIds(sku);
                            } else {
                                fetchAccessories(sku);
                            }

                            //break;
                        }
                    } else {
                        console.log("Not Finished Goods");
                    }
                });
            } else {
                if (timeOut > 0) {
                    timeOut -= 50;
                    setTimeout(checkDatalayer(PDPproductId), 50);
                }
            }
        }

        function getStaticEntryTexts(sku) {
            var staticEntry = window.staticIds.find(function(item) {
                console.log("Checking static entry for SKU:", sku, "Current item:", item);
                return item[sku] !== undefined;
            });

            if (!staticEntry) {
                console.log("Static entry not found for SKU:", sku);
                return {
                    couponCodeText: "",
                    recsHeaderText: ""
                };
            }

            return {
                couponCodeText: staticEntry.couponCodeText || "",
                recsHeaderText: staticEntry.recsHeaderText || ""
            };
        }

            xhttp.open("GET", BASE_URL + sku, true);

        function getIncluded() {
            var els = document.querySelectorAll(
                    ".basket-item-accordion__section-bundle.basket-item-accordion__section-bundle--included .basket-item-accordion__content-flex .basket-item-accordion__content--tools .basket-item-accordion__bundle-text .basket-item-accordion__bundle-tool-name"
                ),
                res = [];
            for (var i = els.length - 1; i >= 0; i--) {
                res.push(els[i].innerHTML);
            }
            if (
                dataLayer &&
                dataLayer.products &&
                Array.isArray(dataLayer.products)
            ) {
                var products = dataLayer.products;
                for (var i = products.length - 1; i >= 0; i--) {
                    if (
                        products[i].localWebNames &&
                        products[i].localWebNames.en &&
                        (products[i].sapDivision === "SPARE_PARTS" ||
                            products[i].sapDivision === "ACCESSORIES")
                    ) {
                        res.push(products[i].localWebNames.en);
                    }
                }
            }
            return res;
        }
    })(window, document);
