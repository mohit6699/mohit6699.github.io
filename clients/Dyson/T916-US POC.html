<script>
    /* ==========================================================================
   Dyson.com (US) — "free tools" hero button
     .button--transactional.button--free-tools.product-hero__button

   Step 1 of the flow (this file): on click, add the main product to the
   basket via the cart API, look up its real display data, and show a
   popup using the SITE'S OWN "Added to your basket" markup/classes
   (centralizedpopup / add-to-basket-notification__*), populated with
   that real product's name, image, and pricing.

   The product SKU is NOT hardcoded — it's read live from
   dataLayer.primaryProduct.localProductSKU (the same field the site's own
   reference script already relies on), so name/price/image in the popup
   always match whatever product page the button is actually on. If that
   dataLayer field isn't populated for some reason, the script logs an
   error and lets the button's native click go through instead of
   showing a popup with wrong or missing data.

   Accessories: checks a static SKU map first (mirroring the reference
   script's window.staticIds / fetchStaticIds priority), and only falls
   back to deriving from the main product's own productReferences API
   field (fetchAccessorySkus, matching the reference's fetchAccessories)
   when the SKU isn't in that static map. No bundle-selector page
   fetch/scraping involved either way.

   Styling: injectReferenceSiteStyles() injects the ACTUAL site CSS
   (recs_style + the snapper carousel stylesheet) verbatim, idempotently
   (skipped if #recs_style already exists on the page). Since the popup
   and accessory cards reuse the site's own real class names, this gives
   the native look directly instead of a hand-rolled approximation.
   ensureVisibilityStyles() only adds the handful of rules with no site
   equivalent: the overlay/backdrop and the popup panel's own position.
   ========================================================================== */

    (function (w, d) {
        "use strict";

        // ---- Config (US) -----------------------------------------------------------

        // var HERO_BUTTON_SELECTOR =
        //     ".button.button--transactional.js-add-to-basket-button.product-hero__button.add-to-basket__form-button";
        var HERO_BUTTON_SELECTOR = ".button.button--transactional.button--free-tools.product-hero__button";

        var PRODUCT_API_BASE = "https://api.dyson.com/apiman-gateway/dyson/product/1.0/us/";
        var CART_BASE_URL = "https://api.dyson.com/apiman-gateway/dyson/cart/1.0/us/";
        var LANG = "en";

        var STRINGS = {
            addedToBasket: "Added to your basket",
            viewBasket: "View basket",
            continueShopping: "Continue shopping",
            was: "Was",
            save: "Save",
            currency: "$",
            recommendedForYou: "Recommended accessories for you",
            addToBasket: "Add to basket",
            addingToBasket: "Adding...",
            learnMore: "Learn more"
        };

        var MODAL_ID = "dy-atb-popup_T546";

        // ---- Cookie / auth helpers --------------------------------------------------

        function getCookieVal(cname) {
            var cookie = (document.cookie || "").split(";");
            for (var i = cookie.length - 1; i >= 0; i--) {
                if (cookie[i].trim().indexOf(cname + "=") > -1) {
                    return decodeURIComponent(cookie[i].trim().replace(cname + "=", ""));
                }
            }
            return null;
        }

        function checkLoggedIn() {
            return w.dataLayer && w.dataLayer.customer && w.dataLayer.customer.credentialID !== "anonymous";
        }

        // ---- Read the real SKU straight off the current page ----------------------
        // Same source the rest of the site's own scripts use (see the reference
        // "basket recommendations" module: PDPproductId = dataLayer.primaryProduct
        // .localProductSKU). Nothing here is hardcoded to a specific product —
        // whatever page this script runs on, it picks up that page's own SKU.

        function getSkuFromPage() {
            try {
                if (w.dataLayer && w.dataLayer.primaryProduct && w.dataLayer.primaryProduct.localProductSKU) {
                    return w.dataLayer.primaryProduct.localProductSKU;
                }
            } catch (e) {
                /* fall through */
            }
            return null;
        }

        // ---- Add to basket -----------------------------------------------------------

        // In-memory cache of the cart id, in case the server's Set-Cookie doesn't
        // reliably land for this cross-domain (api.dyson.com) XHR. Without this,
        // every add-to-basket call that can't find a cartguid cookie would call
        // createCart again, silently spinning up a NEW empty cart per click
        // instead of adding to the same one — which is why items were "added"
        // (200 OK) but never showed up together on /basket.
        var resolvedCartId = null;

        function rememberCartId(responseJson) {
            if (!responseJson) return;
            var candidate =
                responseJson.guid || responseJson.code || responseJson.cartId || responseJson.id || null;
            if (!candidate) return;

            resolvedCartId = candidate;

            // Also write the cookie ourselves so it persists across page loads too,
            // not just this in-memory session.
            try {
                d.cookie = "cartguid=" + encodeURIComponent(candidate) + "; path=/";
            } catch (e) {
                /* ignore */
            }
        }

        function addProductToBasket(sku, callback) {
            console.groupCollapsed("[T546][BASKET API] addProductToBasket", sku);
            console.log("SKU:", sku);
            console.log("loggedIn:", checkLoggedIn());
            var url;

            if (checkLoggedIn()) {
                url = CART_BASE_URL + "users/" + w.dataLayer.customer.credentialID + "/carts/current";
            } else {
                var cartId = resolvedCartId || getCookieVal("cartguid");
                url = cartId ?
                    CART_BASE_URL + "users/anonymous/carts/" + cartId.replace(/"/g, "") + "/entries" :
                    CART_BASE_URL + "users/anonymous/carts/createCart?lang=" + LANG;
            }

            console.log("Basket request URL:", url);

            var xhr = new XMLHttpRequest();
            xhr.withCredentials = true;
            xhr.onreadystatechange = function () {
                if (this.readyState === 4) {
                    console.log("[T546][BASKET API] response", {
                        sku: sku,
                        status: this.status,
                        ok: this.status === 200,
                        responseText: this.responseText
                    });
                    var ok = this.status === 200;
                    var responseJson = null;
                    if (ok) {
                        try {
                            responseJson = JSON.parse(this.responseText);
                            rememberCartId(responseJson); // capture the cart id for next call
                        } catch (e) {
                            /* not JSON, ignore */
                        }
                    } else {
                        console.error("Add-to-basket failed for", sku, this.status, this.responseText);
                    }
                    if (typeof callback === "function") callback(ok, responseJson);
                    console.log("[T546][BASKET API] callback complete", { sku: sku, ok: ok, parsedResponse: responseJson });
                    console.groupEnd();
                }
            };
            // Bug fix: the createCart branch's URL already ends in "?lang=...", so
            // always appending "?code=..." produced a malformed double "?" query
            // string on the very first add of a session — the sku silently never
            // reached the server on that call, creating an empty cart. Use "&"
            // when a query string is already present, "?" otherwise.
            var separator = url.indexOf("?") > -1 ? "&" : "?";
            xhr.open("POST", url + separator + "code=" + sku + "&lang=" + LANG, true);
            xhr.setRequestHeader("Accept", "application/json");
            xhr.setRequestHeader("Content-type", "application/json");
            xhr.setRequestHeader("x-csrf-token", getCookieVal("CSRF_TOKEN") || "");
            var basketPayload = {
                product: { code: sku },
                quantity: 1
            };
            console.log("Basket request payload:", basketPayload);
            xhr.send(JSON.stringify(basketPayload));
        }

        // ---- Basket count -------------------------------------------------------------
        // No field name confirmed from API docs, so this only returns a number if
        // it can find one from a real source: the add-to-basket response itself,
        // or an existing basket-count badge already rendered on the page. If
        // neither has a usable value, the button just won't show a "(N)" — never
        // a guessed number.

        function getBasketCount(addToBasketResponse) {
            if (addToBasketResponse) {
                var candidates = [
                    addToBasketResponse.totalUnitCount,
                    addToBasketResponse.deliveryItemsQuantity,
                    addToBasketResponse.totalItems,
                    Array.isArray(addToBasketResponse.entries) ? addToBasketResponse.entries.length : null
                ];
                for (var i = 0; i < candidates.length; i++) {
                    if (typeof candidates[i] === "number" && !isNaN(candidates[i])) return candidates[i];
                }
            }

            // Fallback: an existing header/basket-icon badge, if the site renders
            // one — best-effort selector guesses, adjust if these don't match.
            var badge = d.querySelector(
                ".js-basket-count, .basket-count, [data-basket-count], .header-basket__count"
            );
            if (badge) {
                var parsed = parseInt((badge.textContent || "").replace(/\D/g, ""), 10);
                if (!isNaN(parsed)) return parsed;
            }

            return null;
        }

        // ---- Fetch real product display data -----------------------------------------

        function fetchProductDetails(sku, callback) {
            console.groupCollapsed("[T546][PRODUCT API] fetchProductDetails", sku);
            console.log("GET:", PRODUCT_API_BASE + sku);
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (this.readyState === 4 && this.status === 200) {
                    console.log("[T546][PRODUCT API] response", {
                        sku: sku,
                        status: this.status,
                        responseText: this.responseText
                    });
                    try {
                        var res = JSON.parse(this.responseText);
                        console.log("[T546][PRODUCT API] parsed response", res);

                        var name =
                            res.webName ||
                            (res.localWebNames && res.localWebNames[LANG]) ||
                            (res.globalWebNames && res.globalWebNames[LANG]) ||
                            sku;

                        var fullPrice = res.price && res.price.value != null ? res.price.value.toFixed(2) : null;
                        var salePrice =
                            res.reducedPrice && res.reducedPrice.value != null ?
                                res.reducedPrice.value.toFixed(2) :
                                null;
                        var savings = res.savings && res.savings.value != null ? res.savings.value.toFixed(2) : null;

                        var attachmentsCount = null;
                        if (Array.isArray(res.productReferences)) {
                            attachmentsCount = res.productReferences.filter(function (ref) {
                                return ref.referenceType === "CONSISTS_OF";
                            }).length;
                            if (attachmentsCount === 0) attachmentsCount = null;
                        }

                        var warrantyText =
                            res.warrantyDescription ||
                            res.warrantyText ||
                            (res.warrantyPeriod ? "Dyson " + res.warrantyPeriod + " Year Limited Warranty" : null);

                        var productResult = {
                            sku: sku,
                            name: name,
                            fullPrice: fullPrice,
                            salePrice: salePrice,
                            savings: savings,
                            stockBand: res.stockBand,
                            url: res.url,
                            description: res.description || "",
                            badgeText: res.badgeText || "",
                            badgeClass: res.badgeThemeCode || "",
                            ratings: res.bazaarVoiceAverageRating,
                            reviews: res.bazaarVoiceNumberOfReviews,
                            hideWasNowPricing: res.hideWasNowPricing,
                            sapDivision: res.sapDivision,
                            attachmentsCount: attachmentsCount,
                            warrantyText: warrantyText,
                            imageUrl: "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/images/products/primary/" +
                                sku +
                                ".png?$responsive$&fmt=png-alpha&cropPathE=mobile&fit=stretch,1&wid=440",
                            recommendationImageUrl:
                                "https://dyson-h.assetsadobe2.com/is/image/content/dam/dyson/adobetarget/basket-recommendations/" +
                                sku + ".jpg"
                        };
                        console.log("[T546][PRODUCT API] normalized product", productResult);
                        callback(productResult);
                        console.groupEnd();
                    } catch (err) {
                        console.error("[T546][PRODUCT API] parse error", { sku: sku, error: err, responseText: this.responseText });
                        callback(null);
                        console.groupEnd();
                    }
                } else if (this.readyState === 4) {
                    console.error("[T546][PRODUCT API] failed", { sku: sku, status: this.status, responseText: this.responseText });
                    callback(null);
                    console.groupEnd();
                }
            };
            xhr.open("GET", PRODUCT_API_BASE + sku, true);
            xhr.send();
        }

        // ---- Accessories / recommendation cards ------------------------------------
        // Merged from the larger reference implementation:
        // - staticIds/static mapping takes priority
        // - productReferences is the fallback
        // - recommendation cards use the site's existing classes
        // - up to 3 in-stock accessories are rendered
        // - each accessory can be added to the same basket
        // - carousel controls are initialized after cards are inserted

        var recommendationState = {
            mainSku: null,
            candidates: [],
            loaded: 0
        };

        function getStaticAccessorySkus(mainSku) {
            var entry = getMatchedStaticEntry(mainSku);
            console.log("[T546][STATIC MATCH] accessory lookup", {
                mainSku: mainSku,
                staticIdsExists: Array.isArray(w.staticIds),
                staticIdsLength: Array.isArray(w.staticIds) ? w.staticIds.length : 0,
                matchedEntry: entry
            });
            if (entry) {
                var accessorySkus = entry[mainSku] || [];
                console.log("[T546][STATIC MATCH] FOUND", mainSku, accessorySkus);
                return accessorySkus;
            }
            console.warn("[T546][STATIC MATCH] NOT FOUND", mainSku);
            return null;
        }

        function getIncludedNamesFromPage() {
            var names = [];
            var els = d.querySelectorAll(
                ".basket-item-accordion__section-bundle.basket-item-accordion__section-bundle--included " +
                ".basket-item-accordion__content-flex .basket-item-accordion__content--tools " +
                ".basket-item-accordion__bundle-text .basket-item-accordion__bundle-tool-name"
            );

            for (var i = 0; i < els.length; i++) {
                names.push((els[i].textContent || "").trim());
            }

            try {
                if (w.dataLayer && Array.isArray(w.dataLayer.products)) {
                    w.dataLayer.products.forEach(function (p) {
                        if (p.localWebNames && p.localWebNames[LANG]) {
                            names.push(p.localWebNames[LANG]);
                        }
                    });
                }
            } catch (e) {
                /* ignore */
            }

            return names;
        }

        function getRecommendationContainer() {
            console.log("[T546][RECS] getRecommendationContainer");
            var popup = d.getElementById(MODAL_ID);
            console.log("[T546][RECS] popup exists:", !!popup);
            if (!popup) return null;

            var wrapper = popup.querySelector(".add-to-basket-notification__wrapper");
            console.log("[T546][RECS] wrapper exists:", !!wrapper);
            if (!wrapper) return null;

            var container = wrapper.querySelector(".basket-recommendations_T546");
            if (container) return container;

        function fetchAccessories(sku) {
            console.groupCollapsed("[T546][REFERENCE ACCESSORIES] fetchAccessories", sku);
            console.log("GET:", PRODUCT_API_BASE + sku);
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;

                console.log("[T546][REFERENCE ACCESSORIES] response", { sku: sku, status: xhr.status, responseText: xhr.responseText });
                if (xhr.status !== 200) {
                    console.warn("[T546][REFERENCE ACCESSORIES] lookup failed", sku, xhr.status);
                    console.groupEnd();
                    return;
                }

                try {
                    var res = JSON.parse(xhr.responseText) || {};
                    var refs = res.productReferences || [];
                    var included = getIncludedNamesFromPage();
                    var seen = {};
                    console.log("[T546][REFERENCE ACCESSORIES] parsed", { referenceCount: refs.length, includedNames: included });

                    refs.forEach(function (ref) {
                        var target = ref && ref.target;
                        if (!target || !target.code) return;

                        var isAccessoryLike =
                            target.sapDivision === "SPARE_PARTS" ||
                            target.sapDivision === "ACCESSORIES";

                        if (!isAccessoryLike) return;
                        if (included.indexOf(target.webName || "") > -1) return;
                        if (seen[target.code]) return;

                        seen[target.code] = true;
                        console.log("[T546][REFERENCE ACCESSORIES] accepted accessory SKU", target.code, { webName: target.webName, sapDivision: target.sapDivision });
                        fetchAccessoryProduct(target.code);
                    });
                } catch (err) {
                    console.error("[T546][REFERENCE ACCESSORIES] parse error", err);
                }
                console.groupEnd();
            };

            xhr.open("GET", PRODUCT_API_BASE + sku, true);
            xhr.send();
        }

        // ---- Lightweight Embla-style carousel behaviour ----------------------------
        // The larger reference loads Embla dynamically. Here the same UX is kept

        var recommendationScrollState = {
            current: 0
        };

        function getCarouselParts() {
            var root = d.querySelector("#" + MODAL_ID + " .basket-recommendations_T546");
            if (!root) return null;
            return {
                root: root,
                viewport: root.querySelector(".dy-recommendations-viewport_T546"),
                list: root.querySelector("ul.plp-cards__items"),
                prev: root.querySelector(".at-carousel-prev_T546"),
                next: root.querySelector(".at-carousel-next_T546"),
                dots: root.querySelector(".at-carousel-dots_T546")
            };
        }

        function updateRecommendationsCarousel() {
            var parts = getCarouselParts();
            if (!parts || !parts.list) return;

            var items = parts.list.children;
            var maxIndex = Math.max(0, items.length - 1);
            recommendationScrollState.current = Math.min(
                recommendationScrollState.current,
                maxIndex
            );

            if (parts.prev) {
                parts.prev.disabled = recommendationScrollState.current <= 0;
                parts.prev.classList.toggle(
                    "at-carousel-disabled_T546",
                    parts.prev.disabled
                );
            }

            if (parts.next) {
                parts.next.disabled = recommendationScrollState.current >= maxIndex;
                parts.next.classList.toggle(
                    "at-carousel-disabled_T546",
                    parts.next.disabled
                );
            }

            if (parts.dots) {
                parts.dots.innerHTML = "";
                if (items.length > 1) {
                    parts.dots.style.display = "flex";
                    for (var i = 0; i < items.length; i++) {
                        (function (index) {
                            var dot = d.createElement("button");
                            dot.type = "button";
                            dot.className = "at-carousel-dot_T546" +
                                (index === recommendationScrollState.current ? " at-carousel-dot-active_T546" : "");
                            dot.setAttribute("aria-label", "Go to carousel item " + (index + 1));
                            dot.addEventListener("click", function (e) {
                                e.preventDefault();
                                e.stopPropagation();
                                scrollRecommendationsTo(index);
                            });
                            parts.dots.appendChild(dot);
                        })(i);
                    }
                } else {
                    parts.dots.style.display = "none";
                }
            }
        }

        function scrollRecommendationsTo(index) {
            var parts = getCarouselParts();
            if (!parts || !parts.list || !parts.list.children[index]) return;

            recommendationScrollState.current = index;
            var item = parts.list.children[index];
            parts.viewport.scrollTo({
                left: item.offsetLeft,
                behavior: "smooth"
            });

            updateRecommendationsCarousel();
        }

        function initRecommendationsCarousel() {
            var parts = getCarouselParts();
            if (!parts) return;

            if (parts.prev && parts.prev.getAttribute("data-carousel-bound") !== "true") {
                parts.prev.setAttribute("data-carousel-bound", "true");
                parts.prev.addEventListener("click", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (recommendationScrollState.current > 0) {
                        scrollRecommendationsTo(recommendationScrollState.current - 1);
                    }
                });
            }

            if (parts.next && parts.next.getAttribute("data-carousel-bound") !== "true") {
                parts.next.setAttribute("data-carousel-bound", "true");
                parts.next.addEventListener("click", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var partsNow = getCarouselParts();
                    var count = partsNow && partsNow.list ? partsNow.list.children.length : 0;
                    if (recommendationScrollState.current < count - 1) {
                        scrollRecommendationsTo(recommendationScrollState.current + 1);
                    }
                });
            }

            if (parts.viewport && parts.viewport.getAttribute("data-scroll-bound") !== "true") {
                parts.viewport.setAttribute("data-scroll-bound", "true");
                parts.viewport.addEventListener("scroll", function () {
                    if (!parts.list || !parts.list.children.length) return;
                    var left = parts.viewport.scrollLeft;
                    var closest = 0;
                    var distance = Infinity;
                    for (var i = 0; i < parts.list.children.length; i++) {
                        var dlt = Math.abs(parts.list.children[i].offsetLeft - left);
                        if (dlt < distance) {
                            distance = dlt;
                            closest = i;
                        }
                    }
                    recommendationScrollState.current = closest;
                    updateRecommendationsCarousel();
                }, { passive: true });
            }

            updateRecommendationsCarousel();
        }

            wrapper.innerHTML = markup;
            d.body.appendChild(wrapper);
            d.body.classList.add("dy-atb-popup-open_T546");

            wrapper.querySelector(".js-centralized-popup-close").addEventListener("click", closeModal);
            wrapper
                .querySelector(".js-add-to-basket-popup-continue-shopping-btn")
                .addEventListener("click", closeModal);
            wrapper.querySelector(".js-add-to-basket-popup-view-basket-btn").addEventListener("click", function () {
                w.location.href = "/basket";
            });
            wrapper.querySelector(".centralizedpopup__overlay").addEventListener("click", function (e) {
                if (e.target === e.currentTarget) closeModal();
            });

            d.addEventListener("keydown", onKeydown);
            console.log("[T546][POPUP] popup inserted into DOM", d.getElementById(MODAL_ID));

            // Reset and load the merged recommendation module.
            recommendationScrollState.current = 0;
            console.log("[T546][POPUP] starting accessory flow for SKU", product.sku);
            loadAndRenderAccessories(product.sku);
            console.groupEnd();
        }

        // ---- Static SKU match gate -----------------------------------------------------
        // IMPORTANT: this check must happen BEFORE any basket/navigation behavior.
        // The reference script already uses window.staticIds as its source of truth.
        // We keep a local fallback only for this rollout.
        function getMatchedStaticEntry(sku) {
            console.groupCollapsed("[T546][STATIC GATE] getMatchedStaticEntry", sku);
            if (!sku) {
                console.warn("[T546][STATIC GATE] empty SKU");
                console.groupEnd();
                return null;
            }

            var source = Array.isArray(w.staticIds) ? w.staticIds : STATIC_ACCESSORY_IDS;
            console.log("[T546][STATIC GATE] source", {
                usingWindowStaticIds: Array.isArray(w.staticIds),
                sourceLength: source.length,
                sku: sku,
                source: source
            });
            for (var i = 0; i < source.length; i++) {
                var item = source[i];
                console.log("[T546][STATIC GATE] checking entry", i, item);
                if (item && Object.prototype.hasOwnProperty.call(item, sku)) {
                    console.log("[T546][STATIC GATE] MATCH", sku, item);
                    console.groupEnd();
                    return item;
                }
            }
            console.warn("[T546][STATIC GATE] NO MATCH", sku);
            console.groupEnd();
            return null;
        }

        function isSkuInStaticIds(sku) {
            var matched = !!getMatchedStaticEntry(sku);
            console.log("[T546][STATIC GATE] isSkuInStaticIds", { sku: sku, matched: matched });
            return matched;
        }

        // ---- Wire up the hero button -------------------------------------------------
        // This listener is capture-phase so it runs BEFORE the site's own click
        // handlers. It always blocks the first native click, performs the SKU check,
        // then either runs our popup flow (SKU matched) or replays the original click
        // (SKU not matched).
        function initHeroButtonListener() {
            var btn = d.querySelector(HERO_BUTTON_SELECTOR);
            if (!btn || btn.getAttribute("data-atb-popup-bound") === "true") return;

            btn.setAttribute("data-atb-popup-bound", "true");

            btn.addEventListener("click", function (e) {
                console.groupCollapsed("[T546][HERO CLICK] Add to Basket clicked");
                console.log("button:", btn);
                console.log("nativeEvent/defaultPrevented:", { isTrusted: e.isTrusted, defaultPrevented: e.defaultPrevented });
                // Allow the synthetic click used for the non-match/native path to
                // pass through without entering this gate again.
                if (btn.getAttribute("data-sku-gate-bypass") === "true") {
                    console.log("[T546][HERO CLICK] native replay/bypass click - allowing site handler to continue");
                    btn.removeAttribute("data-sku-gate-bypass");
                    console.groupEnd();
                    return;
                }

                // Block EVERYTHING on the original click until SKU matching is done.
                e.preventDefault();
                e.stopImmediatePropagation();
                console.log("[T546][HERO CLICK] native event blocked before SKU decision");

                if (btn.getAttribute("data-adding") === "true") {
                    console.warn("[T546][HERO CLICK] add already in progress");
                    console.groupEnd();
                    return;
                }

                var sku = getSkuFromPage();
                console.log("[T546][HERO CLICK] SKU from dataLayer", sku);
                if (!sku) {
                    console.error(
                        "Could not determine the product SKU from dataLayer.primaryProduct.localProductSKU; " +
                        "replaying the native click because no SKU match can be evaluated."
                    );
                    btn.setAttribute("data-sku-gate-bypass", "true");
                    console.log("[T546][HERO CLICK] no SKU - replaying native click", btn);
                    btn.click();
                    console.groupEnd();
                    return;
                }

                var matched = isSkuInStaticIds(sku);
                console.log("[T546][HERO CLICK] SKU gate result", { sku: sku, staticIdsMatch: matched });

                if (!matched) {
                    // No static recommendation entry: do NOT open our popup.
                    // Replay the original click so the site's native basket/navigation
                    // flow remains unchanged for SKUs outside the static map.
                    btn.setAttribute("data-sku-gate-bypass", "true");
                    console.log("[T546][HERO CLICK] SKU NOT FOUND in staticIds - replaying native click", sku);
                    btn.click();
                    console.groupEnd();
                    return;
                }

                console.log("[T546][HERO CLICK] SKU FOUND in staticIds - custom popup path", sku);
                // Static SKU matched: keep the click fully intercepted and run the
                // custom add-to-basket + popup flow. Nothing native can navigate away.
                btn.setAttribute("data-adding", "true");
                console.log("[T546][HERO CLICK] starting main-product add to basket", sku);

                addProductToBasket(sku, function (ok, addToBasketResponse) {
                    console.log("[T546][HERO CLICK] main-product basket callback", { sku: sku, ok: ok, response: addToBasketResponse });
                    var basketCount = getBasketCount(addToBasketResponse);
                    console.log("[T546][HERO CLICK] basketCount", basketCount);
                    fetchProductDetails(sku, function (product) {
                        console.log("[T546][HERO CLICK] main-product details callback", { sku: sku, product: product });
                        btn.removeAttribute("data-adding");
                        if (ok && product) {
                            renderPopup(product, basketCount);
                        } else if (!ok) {
                            console.error("[T546][HERO CLICK] matched SKU could not be added to basket", sku);
                        } else {
                            console.error("[T546][HERO CLICK] product details unavailable", sku);
                        }
                        console.groupEnd();
                    });
                });
            }, true); // capture phase: before the site's bubble handlers
        }

        // Keep checking indefinitely rather than stopping after the first find —
        // if the button element ever gets replaced by a re-render (hydration,
        // personalization swap, etc.), the new node won't have our listener on
        // it, and a click would fall through to the native href navigation
        // instead of showing the popup. initHeroButtonListener() already guards
        // against double-binding the same node via data-atb-popup-bound.
        setInterval(function () {
            initHeroButtonListener();
        }, 500);
    })(window, document);
</script>
