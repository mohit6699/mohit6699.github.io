<script>
\n  console.log('Campaign: ' + \"[100% PREREQ] EXP | PROD | 341754 - Combining check-in and Manage section\" + ' ExpName: ' + \"Experience A\");\n  \n    (function() {\n        \"use strict\";\n        var Atarget = {\n            selector: '.booking-widget',\n            init() {\n                const selExists = document.querySelector(this.selector);\n                if (selExists) {\n                    this.activate();\n                } else {\n                    helpers.elementLoaded(this.selector, this.init.bind(this));\n                }\n                helpers.timeout();\n            },\n            activate(){\n                var mbTAB = document.querySelector('.booking-widget app-nbx-explore').shadowRoot.querySelector(\"#book-tab-managebooking\") || document.querySelector('.booking-widget app-nbx-explore').shadowRoot.querySelector(\".tab-content .accordion-item:nth-child(3) h4\")\n                mbTAB.addEventListener('click', function (params) {\n                    adobe.target.getOffer({\n                        mbox: '341754-manageBK-mbox',\n                        params: {\n                            \"platform\": digitalData.page.siteInfo.platform\n                        },\n                        success: (offers) => {\n                            adobe.target.applyOffer({\n                                mbox: '341754-manageBK-mbox',\n                                offer: offers,\n                            });\n                        },\n                        error: (status, error) => {\n                        }\n                    });\n                }, false);\n            }\n            \n        };\n        const helpers = {\n            eleTimer: '',\n            elementLoaded(ele, callback) {\n                window.clearTimeout(Atarget.eleTimer);\n                if (document.querySelectorAll(ele).length > 0) {\n                    callback();\n                } else {\n                    Atarget.eleTimer = window.setTimeout(() => {\n                        helpers.elementLoaded(ele, callback);\n                    }, 100);\n                }\n            },\n            timeout() {\n                setTimeout(() => {\n                    window.clearTimeout(Atarget.eleTimer);\n                }, 6000);\n            }\n        };\n\n        Atarget.init();\n    })();\n
</script>
