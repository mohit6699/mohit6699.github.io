<script>
    var now = new Date().getTime();
    var twentyFourHours = 86400000;
    var registry = user.get('prompt_registry');

    // Parse existing data or start fresh
    var data = (registry && registry != "false") ? JSON.parse(registry) : {};

    // IMPORTANT: Catch the param from your Edge event 'clicked_id'
    var clickedId = mbox.param('clicked_id');

    if (clickedId) {
        data["p" + clickedId] = now;
    }

    // Automatic Cleanup: Remove any entry older than 24 hours
    for (var id in data) {
        if (now - data[id] > twentyFourHours) {
            delete data[id];
        }
    }

    return Object.keys(data).length > 0 ? JSON.stringify(data) : "false";
</script>
